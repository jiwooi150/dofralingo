<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>도플라링고 - 도황의 영어공부법</title>
    
    <!-- PWA 및 모바일 브라우저 메타태그 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="도플라링고">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    
    <!-- 인라인 Web App Manifest -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"도플라링고","short_name":"도플라링고","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#ec4899","icons":[{"src":"title.png","sizes":"192x192","type":"image/png"}]}'>
    
    <!-- 아이콘 설정 -->
    <link rel="apple-touch-icon" href="title.png">
    <link rel="icon" type="image/png" href="title.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- 컨페티 효과 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
            font-family: 'Jua', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            position: relative;
        }

        /* 은은한 네온 은하수 그래디언트 */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 207, 232, 0.6) 0%, rgba(251, 207, 232, 0) 70%);
            top: 5%;
            left: 5%;
            filter: blur(50px);
            z-index: 0;
            animation: neonPulse 8s infinite alternate ease-in-out;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(233, 213, 255, 0.6) 0%, rgba(233, 213, 255, 0) 70%);
            bottom: 5%;
            right: 5%;
            filter: blur(60px);
            z-index: 0;
            animation: neonPulse 10s infinite alternate-reverse ease-in-out;
        }

        @keyframes neonPulse {
            0% { transform: scale(0.9) translate(0, 0); opacity: 0.7; }
            100% { transform: scale(1.1) translate(15px, -15px); opacity: 1; }
        }

        /* 스마트폰 형태 메인 컨테이너 */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px 20px;
            border-radius: 35px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.08),
                0 0 0 1px rgba(236, 72, 153, 0.15),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
            border: 1.5px solid rgba(244, 114, 182, 0.25);
            width: 380px;
            height: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            overflow: hidden; 
            z-index: 1;
        }

        /* 오답 시 Shake 애니메이션 */
        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 0); }
            40% { transform: translate(8px, 0); }
            60% { transform: translate(-6px, 0); }
            80% { transform: translate(6px, 0); }
            100% { transform: translate(0, 0); }
        }
        .shake-anim {
            animation: screenShake 0.4s ease;
        }

        /* 3D 입체 버튼 */
        .btn {
            background: linear-gradient(145deg, #ff53b0 0%, #ec4899 50%, #db2777 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 14px 0;
            width: 80%;
            font-size: 20px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 
                0 5px 0 #be185d, 
                0 8px 15px rgba(236, 72, 153, 0.3);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Jua', sans-serif;
            margin-top: 12px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.08);
            box-shadow: 
                0 7px 0 #be185d, 
                0 12px 20px rgba(236, 72, 153, 0.4);
        }
        .btn:active {
            transform: translateY(3px) scale(1);
            box-shadow: 0 2px 0 #be185d, 0 4px 8px rgba(236, 72, 153, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(145deg, #f472b6 0%, #db2777 100%);
            box-shadow: 0 5px 0 #9d174d, 0 8px 15px rgba(219, 39, 119, 0.25);
        }

        /* 인트로 화면 */
        .intro-container {
            background: rgba(253, 242, 248, 0.95);
            cursor: pointer;
        }
        .intro-text {
            font-size: 52px;
            font-weight: bold;
            color: #db2777;
            letter-spacing: 3px;
            text-shadow: 0 4px 12px rgba(219, 39, 119, 0.25);
            opacity: 0;
            transform: translateY(30px);
            animation: slideFadeIn 1.2s ease forwards;
        }

        @keyframes slideFadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 타이틀 화면 */
        .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .character-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .speech-bubble {
            position: absolute;
            top: -52px;
            background: #ffffff;
            border: 2px solid #ec4899;
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 15px;
            color: #1f2937;
            white-space: nowrap;
            box-shadow: 0 6px 15px rgba(236, 72, 153, 0.15);
            animation: bubbleBounce 2s infinite ease-in-out;
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -9px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 9px 8px 0 8px;
            border-style: solid;
            border-color: #ec4899 transparent;
            display: block;
            width: 0;
        }
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 7px 6px 0 6px;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .title-image {
            max-width: 180px;
            width: 100%;
            height: auto;
            border: none;
            box-shadow: none;
            background: transparent;
            filter: drop-shadow(0 4px 12px rgba(236, 72, 153, 0.25));
        }
        .logo { 
            font-size: 36px; 
            color: #db2777; 
            margin-bottom: 4px; 
            text-shadow: 0 2px 4px rgba(219, 39, 119, 0.15);
        }
        .subtitle { 
            font-size: 15px; 
            color: #be185d; 
            margin-bottom: 12px; 
            font-weight: bold;
            background: #fce7f3;
            padding: 6px 18px;
            border-radius: 20px;
            border: 1px solid #f472b6;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.15);
        }

        /* DAY 선택 화면 (잠금 및 위계감 부여 적용) */
        .streak-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #ffe4e6;
            border: 1.5px solid #fda4af;
            color: #be185d;
            font-size: 16px;
            padding: 8px 18px;
            border-radius: 25px;
            margin-bottom: 15px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.1);
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        /* 기본 DAY 버튼 (활성 상태) */
        .day-btn {
            background: #ffffff;
            color: #db2777;
            border: 1.5px solid #f472b6;
            padding: 12px 0;
            font-size: 17px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.12);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .day-btn:hover { 
            background: #fdf2f8;
            border-color: #ec4899; 
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 18px rgba(236, 72, 153, 0.22);
        }

        /* 완료된 DAY 버튼 스타일 */
        .day-btn.completed {
            background: linear-gradient(145deg, #be185d 0%, #9d174d 100%);
            color: #ffffff;
            border: 1px solid #9d174d;
            box-shadow: 0 4px 0 #831843, 0 4px 12px rgba(157, 23, 77, 0.25);
        }

        /* 잠긴(Locked) DAY 버튼 스타일 */
        .day-btn.locked {
            background: #f1f5f9;
            color: #94a3b8;
            border: 1.5px solid #e2e8f0;
            box-shadow: none;
            cursor: not-allowed;
            opacity: 0.75;
        }
        .day-btn.locked:hover {
            transform: none;
            background: #f1f5f9;
            border-color: #e2e8f0;
            box-shadow: none;
        }
        
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .page-arrow {
            background: linear-gradient(145deg, #f472b6, #ec4899);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.6);
            width: 40px;
            height: 40px;
            font-size: 18px;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            box-shadow: 0 3px 0 #be185d, 0 4px 10px rgba(236, 72, 153, 0.2);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .page-arrow:hover {
            transform: scale(1.1);
        }
        .page-indicator { font-size: 16px; color: #db2777; font-weight: bold; }

        .rule-title { 
            font-size: 26px; 
            color: #be185d; 
            margin-bottom: 20px; 
            font-weight: bold;
        }
        .rule-box {
            background: #fdf2f8;
            border: 1.5px dashed #f472b6;
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            text-align: left;
            font-size: 18px;
            color: #334155;
            line-height: 1.6;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .quiz-content-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 15px; 
        }

        .quiz-home-btn {
            position: absolute;
            top: -15px;
            left: 10px;
            background: #ffffff;
            border: 1px solid #f472b6;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 14px;
            color: #db2777;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .quiz-home-btn:hover {
            transform: scale(1.05);
            background: #fdf2f8;
        }

        .timer-badge {
            position: absolute;
            top: -15px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
            background: #fce7f3;
            border: 1px solid #f472b6;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 15px;
            color: #be185d;
            font-weight: bold;
        }
        .timer-badge svg { width: 16px; height: 16px; fill: #be185d; }

        .question-title { 
            font-size: 24px; 
            color: #db2777; 
            margin-bottom: 15px; 
            width: 100%; 
            text-align: left; 
            padding-left: 10px; 
            box-sizing: border-box;
        }
        .question-text { 
            font-size: 17px; 
            color: #1e293b; 
            margin-bottom: 20px; 
            line-height: 1.5; 
            text-align: left; 
            width: 100%; 
            padding: 0 10px; 
            box-sizing: border-box;
        }
        
        .options { display: flex; flex-direction: column; gap: 10px; width: 100%; padding: 0 10px; box-sizing: border-box; }
        
        .option-btn {
            background: #ffffff;
            color: #1e293b;
            border: 1.5px solid #cbd5e1;
            padding: 12px 14px;
            font-size: 17px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Jua', sans-serif;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.04);
        }
        .option-btn:hover { 
            background: #fdf2f8;
            border-color: #ec4899; 
            color: #db2777;
            transform: translateY(-2px);
        }

        .result-image {
            max-width: 160px;
            max-height: 150px;
            width: auto;
            height: auto;
            border-radius: 16px;
            margin-bottom: 8px;
            display: none;
            object-fit: contain;
        }
        .result-text { font-size: 24px; margin-bottom: 6px; font-weight: bold; }

        /* 결과 화면 내 해설 텍스트 상자 (원상복구형) */
        .result-explanation {
            font-size: 15px;
            color: #1e293b;
            line-height: 1.4;
            background: #fdf2f8;
            border: 1.5px dashed #f472b6;
            padding: 10px 14px;
            border-radius: 14px;
            white-space: pre-line;
            margin: 8px 0;
            width: 90%;
            text-align: left;
            box-sizing: border-box;
            max-height: 140px;
            overflow-y: auto;
        }

        .review-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding-top: 15px;
        }

        .flashcard-scene {
            width: 88%;
            height: 190px;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 1.5px solid #f472b6;
            border-radius: 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.12);
        }

        .card-label { font-size: 14px; color: #db2777; margin-bottom: 6px; font-weight: bold; }
        .card-content { font-size: 30px; color: #0f172a; font-weight: bold; word-break: break-all; }

        /* ===================================================
           스무스 바텀 시트 (오늘의 단어 전용으로 유지)
        =================================================== */
        .sheet-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.35);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .bottom-sheet {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translate(-50%, 100%);
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.98);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 
                0 -10px 40px rgba(0, 0, 0, 0.15),
                0 0 0 1.5px rgba(244, 114, 182, 0.3);
            z-index: 101;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 12px 20px 20px 20px;
            box-sizing: border-box;
            will-change: transform;
        }
        .bottom-sheet.active {
            transform: translate(-50%, 0);
        }

        .sheet-header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 6px;
            cursor: grab;
            touch-action: none;
        }
        .sheet-handle {
            width: 45px;
            height: 5px;
            background: #cbd5e1;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: background 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sheet-header:active .sheet-handle {
            background: #ec4899;
        }
        .sheet-title {
            font-size: 20px;
            color: #db2777;
            font-weight: bold;
        }

        .sheet-content {
            max-height: 50vh;
            overflow-y: auto;
            text-align: left;
            padding-right: 2px;
        }

        .quick-word-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
        }
        .quick-word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #fdf2f8;
            border-radius: 14px;
            border: 1px solid #fbcfe8;
            font-size: 16px;
        }
        .quick-word-item .word { font-weight: bold; color: #be185d; }
        .quick-word-item .meaning { color: #475569; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 0. 인트로 화면 -->
    <div id="intro-screen" class="container intro-container" onclick="skipIntro()">
        <div class="intro-text">Doflalingo</div>
    </div>

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" class="container hidden">
        <div class="title-wrapper">
            <div class="character-area">
                <div id="speech-bubble" class="speech-bubble">공부 안 하고 뭐 하냐? 훗훗훗!</div>
                <img src="title.png" alt="타이틀 이미지" class="title-image" onerror="this.style.visibility='hidden';">
            </div>
            <div class="logo">도플라링고</div>
            <div class="subtitle">도황의 영어공부법</div>
            <button class="btn" onclick="playButtonSound(); goToDaySelect()">일일 과제</button>
            <button class="btn btn-secondary" onclick="playButtonSound(); startVocabularyDeck()">단어장</button>
            <button class="btn" style="background: linear-gradient(145deg, #a855f7 0%, #7e22ce 100%); box-shadow: 0 5px 0 #581c87, 0 8px 15px rgba(168, 85, 247, 0.25); font-size: 17px; padding: 11px 0;" onclick="playButtonSound(); openQuickWordSheet()">⚡ 오늘의 단어</button>
        </div>
    </div>

    <!-- 2. DAY 선택 화면 -->
    <div id="day-screen" class="container hidden">
        <div id="streak-badge" class="streak-badge">🔥 연속 출석: 1일째</div>
        <div id="day-grid" class="day-grid"></div>
        <div class="pagination-container">
            <button class="page-arrow" onclick="playButtonSound(); changePage(-1)">◀</button>
            <span id="page-indicator" class="page-indicator">1 / 3 페이지</span>
            <button class="page-arrow" onclick="playButtonSound(); changePage(1)">▶</button>
        </div>
        <button class="btn" style="width: 50%; padding: 10px 0; font-size: 16px; margin-top: 10px;" onclick="playButtonSound(); goToTitle()">메인으로</button>
    </div>

    <!-- 3. 문제풀이 규칙 화면 -->
    <div id="rule-screen" class="container hidden">
        <div class="rule-title">&lt;문제풀이규칙&gt;</div>
        <div class="rule-box">
            1. 보기 먼저 확인<br><br>
            2. 명사 동사 나누기<br><br>
            3. 모르면 울지 말고 근거 있게 찍기
        </div>
        <button class="btn" onclick="playButtonSound(); startQuiz()">문제풀기</button>
    </div>

    <!-- 4. 퀴즈 화면 -->
    <div id="quiz-screen" class="container hidden">
        <div id="quiz-wrapper" class="quiz-content-wrapper">
            <button class="quiz-home-btn" onclick="playButtonSound(); goToTitleFromQuiz()">🏠 메인</button>
            <div class="timer-badge">
                <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,4M12.5,7H11V13L16.25,16.15L17,14.92L12.5,12.25V7Z"/></svg>
                <span id="quiz-timer">20</span>초
            </div>
            <div id="q-title" class="question-title">1번 문제 (틀리면 죽자)</div>
            <div id="q-text" class="question-text"></div>
            <div id="q-options" class="options"></div>
        </div>
    </div>

    <script>
        const questions = [

            {

                ],

            },
            {
                number: 5,
                title: "DAY 1 - 5번 문제",
                text: "Only staff employed for more than 15 years are <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> to receive an Excellent Worker Award.",
                options: [
                    { label: "(A) accountable", val: "A" },
                    { label: "(B) modified", val: "B" },
                    { label: "(C) entitled", val: "C" },
                    { label: "(D) important", val: "D" }
                ],
                correct: "C",
                explanation: "💡 해설\nentitled = ~을 받을 자격이 있다 (be entitled to) (정답)"
            }
        ];

        const allDayFlashcards = {
            day1: [
                { word: "Formerly", meaning: "이전에" },
                { word: "withdraw", meaning: "철회하다" },
                { word: "aside", meaning: "따로" },
                { word: "representation", meaning: "대표단" },
                { word: "along with", meaning: "함께" },
                { word: "owing to", meaning: "~때문에" },
                { word: "despite", meaning: "~불구하고" },
                { word: "in order that", meaning: "~할 수 있도록" },
                { word: "now that", meaning: "~이므로" },
                { word: "recession", meaning: "불경기" }
            ],
        };

        const randomTaunts = [
            "공부 안 하고 뭐 하냐? 훗훗훗!",
            "설마 아직도 영어 단어를 몰라서 헤매는 건 아니겠지?",
            "세상은 실력자만이 살아남는 법이지. 단어부터 외워라!",
            "오늘도 놀기만 할 건가? 토익이 너를 기다린다!",
            "내 밑으로 집합! 영어 공부는 제대로 하고 있겠지?",
            "흐름을 읽어라! 영어도 전략이다.",
            "실망시키지 마라, 훗훗훗... 얼른 과제를 시작해!",
            "늦었다고 생각할 때가 진짜 늦은 거다. 당장 풀어라!"
        ];

        let currentQuizIndex = 0;
        let isCorrectAnswer = false;
        let currentDayPage = 0;
        let activeFlashcards = []; 
        let currentReviewIndex = 0;
        let isShowingMeaning = false;
        let introTimer = null;
        let hasIntroPassed = false;
        
        let quizTimerInterval = null;
        let quizTimeLeft = 20;

        let reviewTimerInterval = null;
        let reviewTimeLeft = 5;

        function preloadImages() {
            const imagesToPreload = ['title.png', 'correct.gif', 'wrong.png', 'complete.gif'];
            imagesToPreload.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        function hideAddressBar() {
            setTimeout(() => { window.scrollTo(0, 1); }, 0);
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            }
        }

        function checkStreakSystem() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let lastVisitDate = localStorage.getItem('dofla_last_visit');
            let currentStreak = parseInt(localStorage.getItem('dofla_streak') || '1', 10);

            if (!lastVisitDate) {
                localStorage.setItem('dofla_last_visit', todayStr);
                localStorage.setItem('dofla_streak', '1');
                return 1;
            }

            const lastDate = new Date(lastVisitDate);
            const nowDate = new Date(todayStr);
            const diffDays = Math.round((nowDate - lastDate) / (1000 * 60 * 60 * 24));

            if (diffDays === 1) {
                currentStreak += 1;
                localStorage.setItem('dofla_streak', currentStreak.toString());
                localStorage.setItem('dofla_last_visit', todayStr);
            } else if (diffDays > 1) {
                currentStreak = 1;
                localStorage.setItem('dofla_streak', '1');
                localStorage.setItem('dofla_last_visit', todayStr);
            }
            return currentStreak;
        }

        function playSoundFile(filename) {
            try {
                const audio = new Audio(filename);
                audio.currentTime = 0;
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log(filename + " play skip:", e));
                }
            } catch(e) {
                console.log("Audio play error", e);
            }
        }

        function playButtonSound() {
            hideAddressBar();
            playSoundFile('1.mp3');
        }

        window.onload = function() {
            preloadImages();
            hideAddressBar();
            checkStreakSystem();
            playSoundFile('start.mp3');

            introTimer = setTimeout(() => {
                transitionToIntoTitle();
            }, 3000); 

            initBottomSheetEvents();
        };

        window.addEventListener('touchstart', hideAddressBar, { once: true });
        window.addEventListener('click', hideAddressBar, { once: true });

        function skipIntro() {
            hideAddressBar();
            if (hasIntroPassed) return;
            hasIntroPassed = true;
            clearTimeout(introTimer);
            transitionToIntoTitle();
        }

        function transitionToIntoTitle() {
            hasIntroPassed = true;
            document.getElementById('intro-screen').classList.add('hidden');
            const randomIndex = Math.floor(Math.random() * randomTaunts.length);
            document.getElementById('speech-bubble').innerText = randomTaunts[randomIndex];
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToTitle() {
            document.getElementById('day-screen').classList.add('hidden');
            const randomIndex = Math.floor(Math.random() * randomTaunts.length);
            document.getElementById('speech-bubble').innerText = randomTaunts[randomIndex];
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToTitleFromQuiz() {
            clearInterval(quizTimerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            const randomIndex = Math.floor(Math.random() * randomTaunts.length);
            document.getElementById('speech-bubble').innerText = randomTaunts[randomIndex];
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToTitleFromReview() {
            clearInterval(reviewTimerInterval);
            document.getElementById('review-screen').classList.add('hidden');
            const randomIndex = Math.floor(Math.random() * randomTaunts.length);
            document.getElementById('speech-bubble').innerText = randomTaunts[randomIndex];
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToDaySelect() {
            document.getElementById('title-screen').classList.add('hidden');
            renderDayButtons();
            document.getElementById('day-screen').classList.remove('hidden');
        }

        function startVocabularyDeck() {
            let combined = [];
            for (let dayKey in allDayFlashcards) {
                combined = combined.concat(allDayFlashcards[dayKey]);
            }
            for (let i = combined.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [combined[i], combined[j]] = [combined[j], combined[i]];
            }
            activeFlashcards = combined;
            document.getElementById('title-screen').classList.add('hidden');
            startReview();
        }

        // DAY 선택창 렌더링 (잠금 상태 및 위계감 부여 적용)
        function renderDayButtons() {
            const grid = document.getElementById('day-grid');
            grid.innerHTML = '';
            
            const startDay = currentDayPage * 10 + 1;
            const endDay = startDay + 9;

            const isDay1Completed = localStorage.getItem('dofla_day1_completed') === 'true';
            const currentStreak = localStorage.getItem('dofla_streak') || '1';
            
            document.getElementById('streak-badge').innerHTML = `🔥 연속 출석: ${currentStreak}일째 버티는 중`;

            for (let i = startDay; i <= endDay; i++) {
                const btn = document.createElement('button');
                
                if (i === 1) {
                    if (isDay1Completed) {
                        btn.className = 'day-btn completed';
                        btn.innerHTML = `DAY ${i} ✓`;
                    } else {
                        btn.className = 'day-btn';
                        btn.innerHTML = `DAY ${i} ✨`;
                    }
                    btn.onclick = () => { playButtonSound(); showRuleScreen(); };
                } else {
                    // DAY 2 이후는 잠긴(Locked) 위계감 적용
                    btn.className = 'day-btn locked';
                    btn.innerHTML = `DAY ${i} 🔒`;
                    btn.onclick = () => { playButtonSound(); alert(`DAY ${i}는 아직 잠겨 있다! 먼저 이전 과제를 완료해라 훗훗훗...`); };
                }
                grid.appendChild(btn);
            }

            document.getElementById('page-indicator').innerText = `${currentDayPage + 1} / 3 페이지`;
        }

        function changePage(direction) {
            currentDayPage += direction;
            if (currentDayPage < 0) currentDayPage = 2; 
            if (currentDayPage > 2) currentDayPage = 0;
            renderDayButtons();
        }

        function showRuleScreen() {
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('rule-screen').classList.remove('hidden');
        }

        function startQuiz() {
            currentQuizIndex = 0;
            document.getElementById('rule-screen').classList.add('hidden');
            loadQuestion(currentQuizIndex);
        }

        function loadQuestion(index) {
            clearInterval(quizTimerInterval);
            quizTimeLeft = 20;
            document.getElementById('quiz-timer').innerText = quizTimeLeft;

            const q = questions[index];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-text').innerHTML = q.text;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = ''; 

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.label;
                btn.onclick = () => { 
                    clearInterval(quizTimerInterval);
                    playButtonSound(); 
                    checkAnswer(opt.val); 
                };
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            quizTimerInterval = setInterval(() => {
                quizTimeLeft--;
                document.getElementById('quiz-timer').innerText = quizTimeLeft;
                if (quizTimeLeft <= 0) {
                    clearInterval(quizTimerInterval);
                    handleQuizTimeout();
                }
            }, 1000);
        }

        function handleQuizTimeout() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const resultScreenContainer = document.getElementById('result-screen');
            resultScreenContainer.classList.add('shake-anim');
            setTimeout(() => { resultScreenContainer.classList.remove('shake-anim'); }, 400);

            const resultImg = document.getElementById('result-img');
            const resultMsg = document.getElementById('result-msg');
            const resultExp = document.getElementById('result-exp');
            const actionBtn = document.getElementById('action-btn');
            
            resultImg.style.display = 'block';
            isCorrectAnswer = false;
            resultImg.src = "wrong.png"; 
            resultMsg.style.color = "#dc2626";
            resultMsg.innerText = "시간 초과! 죽어";
            resultExp.classList.add('hidden');
            actionBtn.innerText = "다시";

            playSoundFile('wrong.mp3');
            if (navigator.vibrate) { navigator.vibrate([100, 50, 100]); }
        }

        function checkAnswer(selectedOption) {
            const q = questions[currentQuizIndex];
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const resultImg = document.getElementById('result-img');
            const resultMsg = document.getElementById('result-msg');
            const resultExp = document.getElementById('result-exp');
            const actionBtn = document.getElementById('action-btn');
            
            resultImg.style.display = 'block';

            if (selectedOption === q.correct) {
                isCorrectAnswer = true;
                resultImg.src = "correct.gif"; 
                resultMsg.style.color = "#db2777";
                resultMsg.innerText = "도~황!";
                
                // 결과 화면 안에 해설 표시 (원상복구)
                resultExp.innerText = q.explanation;
                resultExp.classList.remove('hidden');

                let nextText = (currentQuizIndex + 1 < questions.length) ? "다음" : "복습하기";
                actionBtn.innerText = nextText;

                playSoundFile('correct.mp3');
            } else {
                isCorrectAnswer = false;
                
                const resultScreenContainer = document.getElementById('result-screen');
                resultScreenContainer.classList.add('shake-anim');
                setTimeout(() => { resultScreenContainer.classList.remove('shake-anim'); }, 400);

                resultImg.src = "wrong.png"; 
                resultMsg.style.color = "#dc2626";
                resultMsg.innerText = "죽어";
                resultExp.classList.add('hidden');
                actionBtn.innerText = "다시";

                playSoundFile('wrong.mp3');
                if (navigator.vibrate) { navigator.vibrate([100, 50, 100]); }
            }
        }

        function handleNextAction() {
            if (isCorrectAnswer) {
                currentQuizIndex++;
                if (currentQuizIndex < questions.length) {
                    loadQuestion(currentQuizIndex);
                } else {
                    document.getElementById('result-screen').classList.add('hidden');
                    let combined = [];
                    for (let dayKey in allDayFlashcards) {
                        combined = combined.concat(allDayFlashcards[dayKey]);
                    }
                    for (let i = combined.length - 1; i > 0; i--) {
                        let j = Math.floor(Math.random() * (i + 1));
                        [combined[i], combined[j]] = [combined[j], combined[i]];
                    }
                    activeFlashcards = combined;
                    startReview();
                }
            } else {
                loadQuestion(currentQuizIndex);
            }
        }

        function startReview() {
            currentReviewIndex = 0;
            isShowingMeaning = false;
            updateFlashcardContent(true);
            document.getElementById('review-screen').classList.remove('hidden');
        }

        function updateFlashcardContent(isInitial) {
            clearInterval(reviewTimerInterval);
            reviewTimeLeft = 5;
            document.getElementById('review-timer').innerText = reviewTimeLeft;

            const card = activeFlashcards[currentReviewIndex];
            const cardLabel = document.getElementById('card-label');
            const cardText = document.getElementById('card-text');
            const reviewBtn = document.getElementById('review-btn');

            setCardTextData(card, cardLabel, cardText, reviewBtn);

            reviewTimerInterval = setInterval(() => {
                reviewTimeLeft--;
                document.getElementById('review-timer').innerText = reviewTimeLeft;
                if (reviewTimeLeft <= 0) {
                    clearInterval(reviewTimerInterval);
                    handleReviewAction();
                }
            }, 1000);
        }

        function setCardTextData(card, cardLabel, cardText, reviewBtn) {
            if (!isShowingMeaning) {
                cardLabel.innerText = "단어";
                cardText.innerText = card.word;
                cardText.style.color = "#0f172a";
                reviewBtn.innerText = "정답 확인";
            } else {
                cardLabel.innerText = "뜻";
                cardText.innerText = card.meaning;
                cardText.style.color = "#db2777";
                if (currentReviewIndex === activeFlashcards.length - 1) {
                    reviewBtn.innerText = "학습 완료";
                } else {
                    reviewBtn.innerText = "다음 단어";
                }
            }
        }

        function handleReviewAction() {
            clearInterval(reviewTimerInterval);
            if (!isShowingMeaning) {
                isShowingMeaning = true;
                updateFlashcardContent(false);
            } else {
                currentReviewIndex++;
                if (currentReviewIndex < activeFlashcards.length) {
                    isShowingMeaning = false;
                    updateFlashcardContent(false);
                } else {
                    localStorage.setItem('dofla_day1_completed', 'true');
                    triggerCompletionEffects();
                }
            }
        }

        function triggerCompletionEffects() {
            clearInterval(reviewTimerInterval);
            playSoundFile('end.mp3');

            if (navigator.vibrate) { navigator.vibrate(300); }

            try {
                confetti({
                    particleCount: 120,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ec4899', '#f472b6', '#db2777']
                });
            } catch(e) { console.log("Confetti library load fail", e); }

            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('complete-screen').classList.remove('hidden');
        }

        function returnToMainFromComplete() {
            document.getElementById('complete-screen').classList.add('hidden');
            const randomIndex = Math.floor(Math.random() * randomTaunts.length);
            document.getElementById('speech-bubble').innerText = randomTaunts[randomIndex];
            document.getElementById('title-screen').classList.remove('hidden');
        }

        /* ===================================================
           스무스 바텀 시트 (오늘의 단어 전용 제어)
        =================================================== */

        const sheetContent = document.getElementById('sheet-content');

        let currentY = 0;

            sheetBackdrop.classList.add('active');
            bottomSheet.classList.add('active');
            bottomSheet.style.transform = 'translate(-50%, 0)';
        }

        function closeBottomSheet() {
            bottomSheet.style.transform = '';
            bottomSheet.classList.remove('active');
            sheetBackdrop.classList.remove('active');
        }

            sheetTitle.innerText = "도황의 오늘의 단어 ⚡";
            sheetContent.innerHTML = `
                <p style="margin: 0 0 10px 0; color: #64748b; font-size: 14px; text-align: center;">아래로 당기거나 배경을 누르면 닫힙니다.</p>
                <div class="quick-word-list">

                    <div class="quick-word-item"><span class="word">owing to</span><span class="meaning">~때문에</span></div>
                    <div class="quick-word-item"><span class="word">despite</span><span class="meaning">~에도 불구하고</span></div>
                    <div class="quick-word-item"><span class="word">recession</span><span class="meaning">불경기</span></div>
                </div>
            `;
            openBottomSheet();
        }

        function initBottomSheetEvents() {
            sheetHeader.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                isDragging = true;
                bottomSheet.style.transition = 'none';
            }, { passive: true });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentY = e.touches[0].clientY;
                const deltaY = currentY - startY;
                if (deltaY > 0) {
                    bottomSheet.style.transform = `translate(-50%, ${deltaY}px)`;
                }
            }, { passive: true });

            window.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                bottomSheet.style.transition = 'transform 0.35s cubic-bezier(0.16, 1, 0.3, 1)';

                const deltaY = currentY - startY;
                if (deltaY > 100) {
                    closeBottomSheet();
                } else {
                    bottomSheet.style.transform = 'translate(-50%, 0)';
                }
                startY = 0;
                currentY = 0;
            });
        }
    </script>
</body>
</html>
