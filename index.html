<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도플라링고 - 도황의 영어공부법</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fdf0f5; 
            font-family: 'Jua', sans-serif;
        }

        /* 스마트폰 화면 비율 스타일 */
        .container {
            text-align: center;
            background-color: white;
            padding: 25px 20px;
            border-radius: 35px;
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
            border: 4px solid #fbcfe8;
            width: 380px;
            height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            overflow: hidden; 
        }

        /* 공통 버튼 스타일 */
        .btn {
            background-color: #ec4899; 
            color: white;
            border: none;
            padding: 14px 0;
            width: 80%;
            font-size: 20px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 0 #be185d;
            transition: all 0.1s;
            font-family: 'Jua', sans-serif;
            margin-top: 15px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #be185d;
        }

        /* 타이틀 화면 상단 PNG 이미지 스타일 */
        .title-image {
            max-width: 230px;
            width: 100%;
            height: auto;
            margin-bottom: 15px;
        }

        /* 로고 글자 핑크빛 적용 */
        .logo { 
            font-size: 52px; 
            color: #ec4899; 
            margin-bottom: 5px; 
            text-shadow: 3px 3px 0px #be185d; 
        }
        .subtitle { 
            font-size: 20px; 
            color: #374151; 
            margin-bottom: 25px; 
            font-weight: bold;
        }

        /* DAY 선택 화면 스타일 */
        .day-title { font-size: 24px; color: #ec4899; margin-bottom: 15px; font-weight: bold; }
        .day-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .day-btn {
            background-color: #fdf2f8;
            color: #374151;
            border: 2px solid #fbcfe8;
            padding: 12px 0;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            transition: 0.2s;
        }
        .day-btn:hover { background-color: #fce7f3; border-color: #ec4899; }
        
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
        }
        .page-arrow {
            background-color: #f472b6;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 18px;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            box-shadow: 0 3px 0 #be185d;
        }
        .page-arrow:active { transform: translateY(3px); box-shadow: 0 0 0 #be185d; }
        .page-indicator { font-size: 16px; color: #4b5563; }

        /* 문제풀이 규칙 화면 전용 스타일 */
        .rule-title { font-size: 26px; color: #ec4899; margin-bottom: 20px; font-weight: bold; }
        .rule-box {
            background-color: #fdf2f8;
            border: 2px dashed #f472b6;
            border-radius: 20px;
            padding: 20px;
            width: 85%;
            text-align: left;
            font-size: 18px;
            color: #374151;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        /* 퀴즈 화면 전용 */
        .question-title { font-size: 24px; color: #ef4444; margin-bottom: 15px; }
        .question-text { font-size: 18px; color: #374151; margin-bottom: 25px; line-height: 1.5; text-align: left; width: 100%; padding: 0 10px; box-sizing: border-box; }
        
        .options { display: flex; flex-direction: column; gap: 12px; width: 100%; padding: 0 10px; box-sizing: border-box; }
        .option-btn {
            background-color: white;
            color: #374151;
            border: 2px solid #fbcfe8;
            padding: 12px;
            font-size: 18px;
            border-radius: 15px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-family: 'Jua', sans-serif;
        }
        .option-btn:hover { background-color: #fdf2f8; border-color: #f472b6; }
        .option-btn:active { background-color: #fbcfe8; }

        /* 결과 화면 전용 */
        .result-image {
            max-width: 240px;
            max-height: 220px;
            width: auto;
            height: auto;
            border-radius: 15px;
            margin-bottom: 12px;
            display: none;
            object-fit: contain;
        }
        .result-text { font-size: 26px; margin-bottom: 8px; }
        
        /* 해설 박스 스타일 */
        .explanation {
            font-size: 15px;
            color: #4b5563;
            background-color: #fdf2f8;
            border: 1.5px dashed #f472b6;
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
            width: 85%;
            text-align: left;
            line-height: 1.4;
            white-space: pre-line;
            display: none;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 배경음악 오디오 태그 -->
    <audio id="bgm" src="bgm.mp3" loop></audio>

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" class="container">
        <img src="title.png" alt="타이틀 이미지" class="title-image">
        <div class="logo">도플라링고</div>
        <div class="subtitle">도황의 영어공부법</div>
        <button class="btn" onclick="goToDaySelect()">시작하기</button>
    </div>

    <!-- 2. DAY 선택 화면 (1~30) -->
    <div id="day-screen" class="container hidden">
        <div class="day-title">학습할 DAY를 선택하라</div>
        <div id="day-grid" class="day-grid"></div>
        <div class="pagination-container">
            <button class="page-arrow" onclick="changePage(-1)">◀</button>
            <span id="page-indicator" class="page-indicator">1 / 3 페이지</span>
            <button class="page-arrow" onclick="changePage(1)">▶</button>
        </div>
        <button class="btn" style="width: 50%; padding: 10px 0; font-size: 16px; margin-top: 10px;" onclick="location.reload()">처음으로</button>
    </div>

    <!-- 3. 문제풀이 규칙 화면 -->
    <div id="rule-screen" class="container hidden">
        <div class="rule-title">&lt;문제풀이규칙&gt;</div>
        <div class="rule-box">
            1. 보기 먼저 확인<br><br>
            2. 명사 동사 나누기<br><br>
            3. 모르면 울지 말고 근거 있게 찍기
        </div>
        <button class="btn" onclick="startQuiz()">문제풀기</button>
    </div>

    <!-- 4. 퀴즈 화면 -->
    <div id="quiz-screen" class="container hidden">
        <div id="q-title" class="question-title">1번 문제 (틀리면 죽자)</div>
        <div id="q-text" class="question-text"></div>
        <div id="q-options" class="options"></div>
    </div>

    <!-- 5. 결과 화면 -->
    <div id="result-screen" class="container hidden">
        <img id="result-img" class="result-image" src="" alt="결과 이미지">
        <div id="result-msg" class="result-text"></div>
        <div id="result-exp" class="explanation"></div>
        <button id="action-btn" class="btn" onclick="handleNextAction()">버튼</button>
    </div>

    <script>
        const questions = [
            {
                number: 1,
                title: "DAY 1 - 1번 문제",
                text: "To attract young consumers, promoting new products online is more <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> than advertising on television.",
                options: [
                    { label: "(A) effects", val: "A" },
                    { label: "(B) effectively", val: "B" },
                    { label: "(C) effecting", val: "C" },
                    { label: "(D) effective", val: "D" }
                ],
                correct: "D",
                explanation: "💡 해설\nmore 이니까 뒤에 형용사"
            },
            {
                number: 2,
                title: "DAY 1 - 2번 문제",
                text: "Twins Excursions employs licensed guides who <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> tours in five different languages.",
                options: [
                    { label: "(A) conduct", val: "A" },
                    { label: "(B) receive", val: "B" },
                    { label: "(C) inspect", val: "C" },
                    { label: "(D) distribute", val: "D" }
                ],
                correct: "A",
                explanation: "💡 해설\nconduct = 안내하다, 수행하다\ninspect = 검사하다\ndistribute = 분배하다"
            }
        ];

        let currentQuizIndex = 0;
        let isCorrectAnswer = false;
        let currentDayPage = 0; // 0: DAY 1~10, 1: DAY 11~20, 2: DAY 21~30

        function goToDaySelect() {
            const bgm = document.getElementById('bgm');
            bgm.volume = 0.2; 
            bgm.play().catch(error => {
                console.log("음악 재생 실패:", error);
            });

            document.getElementById('title-screen').classList.add('hidden');
            renderDayButtons();
            document.getElementById('day-screen').classList.remove('hidden');
        }

        function renderDayButtons() {
            const grid = document.getElementById('day-grid');
            grid.innerHTML = '';
            
            const startDay = currentDayPage * 10 + 1;
            const endDay = startDay + 9;

            for (let i = startDay; i <= endDay; i++) {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.innerText = `DAY ${i}`;
                
                if (i === 1) {
                    btn.onclick = () => showRuleScreen();
                } else {
                    btn.onclick = () => alert(`DAY ${i}는 아직 준비 중이다! 훗훗훗...`);
                }
                grid.appendChild(btn);
            }

            document.getElementById('page-indicator').innerText = `${currentDayPage + 1} / 3 페이지`;
        }

        function changePage(direction) {
            currentDayPage += direction;
            if (currentDayPage < 0) currentDayPage = 2; 
            if (currentDayPage > 2) currentDayPage = 0;
            renderDayButtons();
        }

        function showRuleScreen() {
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('rule-screen').classList.remove('hidden');
        }

        function startQuiz() {
            currentQuizIndex = 0;
            document.getElementById('rule-screen').classList.add('hidden');
            loadQuestion(currentQuizIndex);
        }

        function loadQuestion(index) {
            const q = questions[index];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-text').innerHTML = q.text;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = ''; 

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.label;
                btn.onclick = () => checkAnswer(opt.val);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function checkAnswer(selectedOption) {
            const q = questions[currentQuizIndex];
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const resultImg = document.getElementById('result-img');
            const resultMsg = document.getElementById('result-msg');
            const resultExp = document.getElementById('result-exp');
            const actionBtn = document.getElementById('action-btn');
            
            resultImg.style.display = 'block';

            if (selectedOption === q.correct) {
                isCorrectAnswer = true;
                resultImg.src = "correct.gif"; 
                resultMsg.style.color = "#ec4899";
                resultMsg.innerText = "도~황!";
                
                resultExp.innerText = q.explanation;
                resultExp.style.display = 'block';
                
                if (currentQuizIndex + 1 < questions.length) {
                    actionBtn.innerText = "다음";
                } else {
                    actionBtn.innerText = "DAY 선택으로";
                }
            } else {
                isCorrectAnswer = false;
                resultImg.src = "wrong.png"; 
                resultMsg.style.color = "#ef4444";
                resultMsg.innerText = "죽어";
                
                resultExp.style.display = 'none';
                actionBtn.innerText = "다시";
            }
        }

        function handleNextAction() {
            if (isCorrectAnswer) {
                currentQuizIndex++;
                if (currentQuizIndex < questions.length) {
                    loadQuestion(currentQuizIndex);
                } else {
                    document.getElementById('result-screen').classList.add('hidden');
                    renderDayButtons();
                    document.getElementById('day-screen').classList.remove('hidden');
                }
            } else {
                loadQuestion(currentQuizIndex);
            }
        }
    </script>
</body>
</html>
