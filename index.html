<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>도플라링고 - 도황의 영어공부법</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="도플라링고">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ec4899">
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"도플라링고","short_name":"도플라링고","start_url":".","display":"standalone","background_color":"#0f172a","theme_color":"#ec4899","icons":[{"src":"title.png","sizes":"192x192","type":"image/png"}]}'>
    <link rel="apple-touch-icon" href="title.png">
    <link rel="icon" type="image/png" href="title.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff2a8d;
            --neon-purple: #9d4edd;
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            font-family: 'Jua', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        /* 깃털 파티클 캔버스 */
        #feather-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* 1. 글래스모피즘 메인 컨테이너 */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 25px 20px;
            border-radius: 35px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
            width: 380px;
            height: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        /* 2. 콤보 하이프 게이지 효과 (3콤보 이상 시 후광) */
        .container.hype-active {
            box-shadow: 0 0 35px var(--neon-pink), inset 0 0 20px var(--neon-pink);
            border-color: var(--neon-pink);
        }

        /* 콤보 뱃지 추가 */
        .combo-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255,255,255,0.8);
            box-shadow: 0 0 12px var(--neon-pink);
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }
        .combo-badge.show {
            transform: scale(1.1);
        }

        /* 3. 네온 & 입체 그라데이션 버튼 */
        .btn {
            background: linear-gradient(135deg, #ff2a8d 0%, #9d4edd 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 14px 0;
            width: 80%;
            font-size: 20px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 42, 141, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Jua', sans-serif;
            margin-top: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(255, 42, 141, 0.7), inset 0 2px 0 rgba(255, 255, 255, 0.6);
        }
        .btn:active {
            transform: translateY(2px) scale(0.98);
        }

        /* 네온 텍스트 효과 */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 40px var(--neon-purple);
        }

        .intro-container {
            background: radial-gradient(circle, rgba(255,42,141,0.3) 0%, rgba(15,23,42,0.9) 100%);
            cursor: pointer;
        }
        .intro-text {
            font-size: 52px;
            letter-spacing: 3px;
        }

        .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        /* 4. 실시간 감정 변화 말풍선 */
        .speech-bubble {
            position: absolute;
            top: -55px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid var(--neon-pink);
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 15px;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(255, 42, 141, 0.4);
            animation: bubbleBounce 2s infinite ease-in-out;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .speech-bubble.panic {
            border-color: #ef4444;
            color: #fca5a5;
            box-shadow: 0 0 20px #ef4444;
            animation: panicShake 0.3s infinite ease-in-out;
        }
        .speech-bubble.hyped {
            border-color: #3b82f6;
            color: #93c5fd;
            box-shadow: 0 0 20px #3b82f6;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes panicShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-3px, 2px); }
            75% { transform: translate(3px, -2px); }
        }

        .title-image {
            max-width: 180px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 15px rgba(255,42,141,0.5));
        }

        .logo { font-size: 36px; margin-bottom: 2px; }
        .subtitle { 
            font-size: 15px; 
            color: #f472b6; 
            margin-bottom: 15px; 
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            padding: 0 10px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .day-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px 0;
            font-size: 18px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            backdrop-filter: blur(5px);
            transition: all 0.2s ease;
        }
        .day-btn:hover {
            background: rgba(255, 42, 141, 0.3);
            border-color: var(--neon-pink);
            transform: translateY(-2px);
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            color: #cbd5e1;
        }
        .page-arrow {
            background: rgba(255, 42, 141, 0.3);
            color: white;
            border: 1px solid var(--neon-pink);
            width: 40px;
            height: 40px;
            font-size: 18px;
            border-radius: 50%;
            cursor: pointer;
        }

        .quiz-content-wrapper { width: 100%; position: relative; }
        .quiz-home-btn {
            position: absolute;
            top: -20px;
            left: 5px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #f472b6;
            padding: 5px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Jua';
        }

        .timer-badge {
            position: absolute;
            top: -20px;
            right: 5px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 15px;
        }

        .question-title { font-size: 24px; color: #f472b6; margin-bottom: 15px; text-align: left; }
        .question-text { font-size: 18px; color: #f1f5f9; margin-bottom: 25px; line-height: 1.5; text-align: left; }
        
        .options { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 14px;
            font-size: 17px;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: 'Jua', sans-serif;
        }
        .option-btn:hover {
            background: rgba(255, 42, 141, 0.25);
            border-color: var(--neon-pink);
            transform: translateX(4px);
        }

        /* 5. 스무스 바텀 시트 (Smooth Bottom Sheet) */
        .bottom-sheet-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .bottom-sheet {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-top: 2px solid var(--neon-pink);
            border-radius: 30px 30px 0 0;
            padding: 25px 20px 30px 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -10px 30px rgba(255, 42, 141, 0.3);
        }
        .bottom-sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }
        .sheet-drag-handle {
            width: 40px; height: 5px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            margin-bottom: 15px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 깃털 애니메이션 Canvas -->
    <canvas id="feather-canvas"></canvas>

    <!-- 0. 인트로 화면 -->
    <div id="intro-screen" class="container intro-container" onclick="skipIntro()">
        <div class="intro-text neon-text">Doflalingo</div>
    </div>

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" class="container hidden">
        <div id="combo-badge" class="combo-badge">🔥 0 COMBO!</div>
        <div class="title-wrapper">
            <div class="character-area">
                <div id="speech-bubble" class="speech-bubble">공부 안 하고 뭐 하냐? 훗훗훗!</div>
                <img id="dofla-img" src="title.png" alt="도플라밍고" class="title-image">
            </div>
            <div class="logo neon-text">도플라링고</div>
            <div class="subtitle">도황의 영어공부법</div>
            <button class="btn" onclick="playButtonSound(); goToDaySelect()">일일 과제</button>
            <button class="btn" style="background: linear-gradient(135deg, #9d4edd 0%, #3b82f6 100%);" onclick="playButtonSound(); startVocabularyDeck()">단어장</button>
        </div>
    </div>

    <!-- 2. DAY 선택 화면 -->
    <div id="day-screen" class="container hidden">
        <div id="streak-badge" class="subtitle" style="margin-bottom: 20px;">🔥 연속 출석: 1일째</div>
        <div id="day-grid" class="day-grid"></div>
        <div class="pagination-container">
            <button class="page-arrow" onclick="playButtonSound(); changePage(-1)">◀</button>
            <span id="page-indicator">1 / 3 페이지</span>
            <button class="page-arrow" onclick="playButtonSound(); changePage(1)">▶</button>
        </div>
        <button class="btn" style="width: 50%; padding: 10px 0; font-size: 16px; margin-top: 15px;" onclick="playButtonSound(); goToTitle()">메인으로</button>
    </div>

    <!-- 3. 퀴즈 화면 -->
    <div id="quiz-screen" class="container hidden">
        <div id="quiz-wrapper" class="quiz-content-wrapper">
            <button class="quiz-home-btn" onclick="playButtonSound(); goToTitleFromQuiz()">🏠 메인</button>
            <div class="timer-badge">⏱️ <span id="quiz-timer">20</span>초</div>
            <div id="q-title" class="question-title">1번 문제</div>
            <div id="q-text" class="question-text"></div>
            <div id="q-options" class="options"></div>
        </div>
    </div>

    <!-- 4. 스무스 바텀 시트 모달 (결과 & 해설) -->
    <div id="bottom-sheet-modal" class="bottom-sheet-overlay">
        <div class="bottom-sheet">
            <div class="sheet-drag-handle"></div>
            <div id="result-msg" style="font-size: 26px; margin-bottom: 10px; font-weight: bold;"></div>
            <div id="result-exp" style="font-size: 15px; color: #cbd5e1; background: rgba(255,255,255,0.08); padding: 12px; border-radius: 12px; border: 1px dashed var(--neon-pink); width: 90%; text-align: left; line-height: 1.4; margin-bottom: 15px; white-space: pre-line;"></div>
            <button id="action-btn" class="btn" onclick="playButtonSound(); handleNextAction()">다음</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                title: "DAY 1 - 1번 문제",
                text: "To attract young consumers, promoting new products online is more <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> than advertising on television.",
                options: [
                    { label: "(A) effects", val: "A" },
                    { label: "(B) effectively", val: "B" },
                    { label: "(C) effecting", val: "C" },
                    { label: "(D) effective", val: "D" }
                ],
                correct: "D",
                explanation: "💡 해설\nmore 뒤에는 형용사가 들어갈 자리입니다."
            },
            {
                title: "DAY 1 - 2번 문제",
                text: "Twins Excursions employs licensed guides who <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> tours in five different languages.",
                options: [
                    { label: "(A) conduct", val: "A" },
                    { label: "(B) receive", val: "B" },
                    { label: "(C) inspect", val: "C" },
                    { label: "(D) distribute", val: "D" }
                ],
                correct: "A",
                explanation: "💡 해설\nconduct = 투어를 진행/안내하다\ninspect = 검사하다\ndistribute = 분배하다"
            }
        ];

        let currentQuizIndex = 0;
        let comboCount = 0;
        let isCorrectAnswer = false;
        let quizTimerInterval = null;
        let quizTimeLeft = 20;

        /* --- 1. 깃털 파티클 애니메이션 엔진 --- */
        const canvas = document.getElementById('feather-canvas');
        const ctx = canvas.getContext('2d');
        let feathers = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createFeather() {
            return {
                x: Math.random() * canvas.width,
                y: -20,
                size: Math.random() * 12 + 10,
                speedY: Math.random() * 2 + 1,
                speedX: Math.sin(Math.random() * Math.PI) * 1.5,
                angle: Math.random() * 360,
                spin: (Math.random() - 0.5) * 4,
                color: `hsl(${330 + Math.random() * 30}, 100%, ${60 + Math.random() * 20}%)`
            };
        }

        function triggerFeatherBurst() {
            for (let i = 0; i < 35; i++) {
                feathers.push(createFeather());
            }
        }

        function renderFeathers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            feathers.forEach((f, index) => {
                f.y += f.speedY;
                f.x += Math.sin(f.y / 20) * 1.5;
                f.angle += f.spin;

                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate((f.angle * Math.PI) / 180);
                
                // 깃털 타원형 그리기
                ctx.beginPath();
                ctx.ellipse(0, 0, f.size / 3, f.size, 0, 0, 2 * Math.PI);
                ctx.fillStyle = f.color;
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.restore();

                if (f.y > canvas.height + 20) feathers.splice(index, 1);
            });
            requestAnimationFrame(renderFeathers);
        }
        renderFeathers();

        /* --- 2. 실시간 감정 변화 표정 & 대사 엔진 --- */
        function updateDoflamingoMood(state) {
            const bubble = document.getElementById('speech-bubble');
            bubble.className = 'speech-bubble';

            if (state === 'PANIC') {
                bubble.innerText = "서둘러라! 시간이 없다 훗훗!!";
                bubble.classList.add('panic');
            } else if (state === 'HYPED') {
                bubble.innerText = `폭주 중! ${comboCount}연속 정답이다 훗훗훗!!`;
                bubble.classList.add('hyped');
            } else if (state === 'WRONG') {
                bubble.innerText = "새실로 찌르기 전에 다시 풀어라...";
                bubble.classList.add('panic');
            } else {
                bubble.innerText = "공부 안 하고 뭐 하냐? 훗훗훗!";
            }
        }

        /* --- 3. 콤보 게이지 업데이트 --- */
        function updateComboUI() {
            const badge = document.getElementById('combo-badge');
            const mainContainer = document.querySelector('.container');

            if (comboCount >= 2) {
                badge.innerText = `🔥 ${comboCount} COMBO!`;
                badge.classList.add('show');
                if (comboCount >= 3) {
                    mainContainer.classList.add('hype-active');
                    updateDoflamingoMood('HYPED');
                }
            } else {
                badge.classList.remove('show');
                mainContainer.classList.remove('hype-active');
            }
        }

        /* --- 4. 스무스 바텀 시트 토글 --- */
        function openBottomSheet(msg, exp, isSuccess) {
            const modal = document.getElementById('bottom-sheet-modal');
            const msgEl = document.getElementById('result-msg');
            const expEl = document.getElementById('result-exp');

            msgEl.innerText = msg;
            msgEl.style.color = isSuccess ? '#ff2a8d' : '#ef4444';
            expEl.innerText = exp;
            expEl.style.display = exp ? 'block' : 'none';

            modal.classList.add('active');
        }

        function closeBottomSheet() {
            document.getElementById('bottom-sheet-modal').classList.remove('active');
        }

        /* --- 기타 퀴즈 로직 및 네비게이션 --- */
        function skipIntro() {
            document.getElementById('intro-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function playButtonSound() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }

        function goToDaySelect() {
            document.getElementById('title-screen').classList.add('hidden');
            renderDayButtons();
            document.getElementById('day-screen').classList.remove('hidden');
        }

        function goToTitle() {
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToTitleFromQuiz() {
            clearInterval(quizTimerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function renderDayButtons() {
            const grid = document.getElementById('day-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.innerText = `DAY ${i}`;
                if (i === 1) btn.onclick = () => startQuiz();
                grid.appendChild(btn);
            }
        }

        function startQuiz() {
            currentQuizIndex = 0;
            comboCount = 0;
            updateComboUI();
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion(currentQuizIndex);
        }

        function loadQuestion(index) {
            clearInterval(quizTimerInterval);
            quizTimeLeft = 20;
            document.getElementById('quiz-timer').innerText = quizTimeLeft;

            const q = questions[index];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-text').innerHTML = q.text;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.label;
                btn.onclick = () => checkAnswer(opt.val);
                optionsContainer.appendChild(btn);
            });

            quizTimerInterval = setInterval(() => {
                quizTimeLeft--;
                document.getElementById('quiz-timer').innerText = quizTimeLeft;
                if (quizTimeLeft <= 5) updateDoflamingoMood('PANIC');
                if (quizTimeLeft <= 0) {
                    clearInterval(quizTimerInterval);
                    comboCount = 0;
                    updateComboUI();
                    updateDoflamingoMood('WRONG');
                    openBottomSheet("시간 초과!", "제한 시간이 완료되었습니다.", false);
                }
            }, 1000);
        }

        function checkAnswer(selectedOption) {
            clearInterval(quizTimerInterval);
            const q = questions[currentQuizIndex];

            if (selectedOption === q.correct) {
                isCorrectAnswer = true;
                comboCount++;
                updateComboUI();
                triggerFeatherBurst(); // 핑크 깃털 파티클 연출 실행
                openBottomSheet("도~황! 정답이다", q.explanation, true);
            } else {
                isCorrectAnswer = false;
                comboCount = 0;
                updateComboUI();
                updateDoflamingoMood('WRONG');
                openBottomSheet("틀렸다, 죽어!", "정답을 다시 확인해 보세요.", false);
            }
        }

        function handleNextAction() {
            closeBottomSheet();
            if (isCorrectAnswer) {
                currentQuizIndex++;
                if (currentQuizIndex < questions.length) {
                    loadQuestion(currentQuizIndex);
                } else {
                    goToTitleFromQuiz();
                }
            } else {
                loadQuestion(currentQuizIndex);
            }
        }

        window.onload = () => {
            setTimeout(() => skipIntro(), 2500);
        };
    </script>
</body>
</html>
