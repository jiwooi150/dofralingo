<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>도플라링고 - 도황의 영어공부법</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="도플라링고">
    <meta name="theme-color" content="#ec4899">
    
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff2a8d;
            --neon-purple: #9d4edd;
            --glass-border: rgba(255, 255, 255, 0.25);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
            font-family: 'Jua', sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }

        #feather-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* 메인 컨테이너 (글래스모피즘) */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 16px;
            border-radius: 35px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            width: 380px;
            height: 700px;
            max-height: 92vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .container.hype-active {
            box-shadow: 0 0 35px var(--neon-pink), inset 0 0 15px var(--neon-pink);
            border-color: var(--neon-pink);
        }

        .combo-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #ff007f, #7928ca);
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 15px;
            box-shadow: 0 0 12px var(--neon-pink);
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }
        .combo-badge.show { transform: scale(1.1); }

        .btn {
            background: linear-gradient(135deg, #ff2a8d 0%, #9d4edd 100%);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 13px 0;
            width: 85%;
            font-size: 19px;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 42, 141, 0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Jua', sans-serif;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .btn:active { transform: translateY(2px) scale(0.98); }

        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-pink), 0 0 20px var(--neon-pink), 0 0 35px var(--neon-purple);
        }

        .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* 1. 실시간 감정 변화 캐릭터 영역 */
        .character-area {
            position: relative;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .speech-bubble {
            position: absolute;
            top: -45px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid var(--neon-pink);
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            box-shadow: 0 0 12px rgba(255, 42, 141, 0.4);
            transition: all 0.3s ease;
            z-index: 10;
        }
        .speech-bubble.panic {
            border-color: #ef4444;
            color: #fca5a5;
            box-shadow: 0 0 18px #ef4444;
            animation: panicShake 0.2s infinite ease-in-out;
        }
        .speech-bubble.hyped {
            border-color: #3b82f6;
            color: #93c5fd;
            box-shadow: 0 0 18px #3b82f6;
        }

        .title-image {
            max-width: 160px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 12px rgba(255,42,141,0.5));
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        /* 감정 상태에 따른 캐릭터 이미지 변형 */
        .title-image.emotion-panic {
            transform: scale(1.08) rotate(-3deg);
            filter: drop-shadow(0 0 18px #ef4444) hue-rotate(300deg);
        }
        .title-image.emotion-hyped {
            transform: scale(1.12);
            filter: drop-shadow(0 0 25px #ff2a8d) brightness(1.2);
        }
        .title-image.emotion-wrong {
            transform: scale(0.95) rotate(5deg);
            filter: grayscale(0.6) drop-shadow(0 0 10px #000);
        }

        /* 2. 잔디밭 (Heatmap) 출석부 스타일 */
        .heatmap-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 12px;
        }
        .heatmap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #f472b6;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .heatmap-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            justify-items: center;
        }
        .heatmap-cell {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            transition: all 0.3s ease;
        }
        .heatmap-cell.level-1 { background: rgba(255, 42, 141, 0.3); border-color: rgba(255, 42, 141, 0.5); }
        .heatmap-cell.level-2 { background: rgba(255, 42, 141, 0.6); border-color: rgba(255, 42, 141, 0.8); }
        .heatmap-cell.level-3 { 
            background: #ff2a8d; 
            border-color: #fff; 
            box-shadow: 0 0 8px var(--neon-pink);
            color: #fff; font-weight: bold;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .day-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 0;
            font-size: 17px;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            transition: all 0.2s ease;
        }
        .day-btn:hover {
            background: rgba(255, 42, 141, 0.3);
            border-color: var(--neon-pink);
        }

        .quiz-content-wrapper { width: 100%; position: relative; }
        .quiz-home-btn {
            position: absolute;
            top: -15px; left: 0px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #f472b6;
            padding: 4px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Jua';
        }
        .timer-badge {
            position: absolute;
            top: -15px; right: 0px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 14px;
        }

        .question-title { font-size: 22px; color: #f472b6; margin-top: 25px; margin-bottom: 10px; text-align: left; }
        .question-text { font-size: 17px; color: #f1f5f9; margin-bottom: 20px; line-height: 1.4; text-align: left; }
        .options { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        .option-btn {
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 13px;
            font-size: 16px;
            border-radius: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: 'Jua', sans-serif;
        }
        .option-btn:hover {
            background: rgba(255, 42, 141, 0.25);
            border-color: var(--neon-pink);
        }

        /* 3. 스무스 바텀 시트 (Smooth Bottom Sheet) */
        .bottom-sheet-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .bottom-sheet-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .bottom-sheet {
            position: absolute;
            bottom: 0; left: 0; width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-top: 2px solid var(--neon-pink);
            border-radius: 28px 28px 0 0;
            padding: 20px 20px 25px 20px;
            box-sizing: border-box;
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 -10px 30px rgba(255, 42, 141, 0.3);
        }
        .bottom-sheet-overlay.active .bottom-sheet { transform: translateY(0); }
        .sheet-drag-handle {
            width: 36px; height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            margin-bottom: 12px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="feather-canvas"></canvas>

    <!-- 1. 타이틀 화면 (실시간 감정 변화 캐릭터 탑재) -->
    <div id="title-screen" class="container">
        <div id="combo-badge" class="combo-badge">🔥 0 COMBO!</div>
        <div class="title-wrapper">
            <div class="character-area">
                <div id="speech-bubble" class="speech-bubble">공부 안 하고 뭐 하냐? 훗훗훗!</div>
                <img id="dofla-img" src="title.png" alt="도플라밍고" class="title-image">
            </div>
            <div class="neon-text" style="font-size: 34px;">도플라링고</div>
            <div style="font-size: 14px; color: #f472b6; margin-bottom: 20px;">도황의 영어공부법</div>
            <button class="btn" onclick="goToDaySelect()">일일 과제 (학습)</button>
        </div>
    </div>

    <!-- 2. DAY 선택 화면 (잔디밭 출석부 탑재) -->
    <div id="day-screen" class="container hidden">
        <div style="width: 100%;">
            <div style="font-size: 20px; color: #fff; margin-bottom: 10px; text-align: left; font-weight: bold;">학습 달력</div>
            
            <!-- 잔디밭 Heatmap 영역 -->
            <div class="heatmap-card">
                <div class="heatmap-header">
                    <span>9월 출석 스트릭</span>
                    <span style="color: #ff2a8d; font-size: 12px;">🔥 14일 달성 중</span>
                </div>
                <div id="heatmap-grid" class="heatmap-grid"></div>
            </div>

            <div style="font-size: 18px; color: #fff; margin-bottom: 8px; text-align: left;">DAY 선택</div>
            <div id="day-grid" class="day-grid"></div>
        </div>
        <button class="btn" style="width: 60%; padding: 10px 0; font-size: 15px;" onclick="goToTitle()">메인으로</button>
    </div>

    <!-- 3. 퀴즈 화면 -->
    <div id="quiz-screen" class="container hidden">
        <div class="quiz-content-wrapper">
            <button class="quiz-home-btn" onclick="goToTitleFromQuiz()">🏠 메인</button>
            <div class="timer-badge">⏱️ <span id="quiz-timer">20</span>초</div>
            <div id="q-title" class="question-title">1번 문제</div>
            <div id="q-text" class="question-text"></div>
            <div id="q-options" class="options"></div>
        </div>
    </div>

    <!-- 4. 스무스 바텀 시트 (Smooth Bottom Sheet) -->
    <div id="bottom-sheet-modal" class="bottom-sheet-overlay">
        <div class="bottom-sheet">
            <div class="sheet-drag-handle"></div>
            <div id="result-msg" style="font-size: 24px; margin-bottom: 8px; font-weight: bold;"></div>
            <div id="result-exp" style="font-size: 14px; color: #cbd5e1; background: rgba(255,255,255,0.08); padding: 12px; border-radius: 12px; border: 1px dashed var(--neon-pink); width: 90%; text-align: left; line-height: 1.4; margin-bottom: 15px; white-space: pre-line;"></div>
            <button id="action-btn" class="btn" style="width: 70%;" onclick="handleNextAction()">다음</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                title: "DAY 1 - 1번 문제",
                text: "To attract young consumers, promoting new products online is more <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> than advertising on television.",
                options: [
                    { label: "(A) effects", val: "A" },
                    { label: "(B) effectively", val: "B" },
                    { label: "(C) effecting", val: "C" },
                    { label: "(D) effective", val: "D" }
                ],
                correct: "D",
                explanation: "💡 해설\nmore 뒤에는 형용사(effective)가 올 자리입니다."
            },
            {
                title: "DAY 1 - 2번 문제",
                text: "Twins Excursions employs licensed guides who <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> tours in five different languages.",
                options: [
                    { label: "(A) conduct", val: "A" },
                    { label: "(B) receive", val: "B" },
                    { label: "(C) inspect", val: "C" },
                    { label: "(D) distribute", val: "D" }
                ],
                correct: "A",
                explanation: "💡 해설\nconduct = 투어를 진행/안내하다"
            }
        ];

        let currentQuizIndex = 0;
        let comboCount = 0;
        let isCorrectAnswer = false;
        let quizTimerInterval = null;
        let quizTimeLeft = 20;

        /* --- 1. 깃털 파티클 엔진 --- */
        const canvas = document.getElementById('feather-canvas');
        const ctx = canvas.getContext('2d');
        let feathers = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerFeatherBurst() {
            for (let i = 0; i < 30; i++) {
                feathers.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    size: Math.random() * 10 + 8,
                    speedY: Math.random() * 2 + 1.5,
                    angle: Math.random() * 360,
                    spin: (Math.random() - 0.5) * 4,
                    color: `hsl(${330 + Math.random() * 25}, 100%, 65%)`
                });
            }
        }

        function renderFeathers() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            feathers.forEach((f, index) => {
                f.y += f.speedY;
                f.x += Math.sin(f.y / 15) * 1.2;
                f.angle += f.spin;

                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate((f.angle * Math.PI) / 180);
                ctx.beginPath();
                ctx.ellipse(0, 0, f.size / 3, f.size, 0, 0, 2 * Math.PI);
                ctx.fillStyle = f.color;
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.restore();

                if (f.y > canvas.height + 20) feathers.splice(index, 1);
            });
            requestAnimationFrame(renderFeathers);
        }
        renderFeathers();

        /* --- 2. 실시간 감정 변화 시스템 --- */
        function updateDoflamingoMood(state) {
            const bubble = document.getElementById('speech-bubble');
            const img = document.getElementById('dofla-img');
            
            bubble.className = 'speech-bubble';
            img.className = 'title-image';

            if (state === 'PANIC') {
                bubble.innerText = "서둘러라! 5초 남았다 훗훗!!";
                bubble.classList.add('panic');
                img.classList.add('emotion-panic');
            } else if (state === 'HYPED') {
                bubble.innerText = `폭주 중! ${comboCount}연속 정답이다 훗훗!!`;
                bubble.classList.add('hyped');
                img.classList.add('emotion-hyped');
            } else if (state === 'WRONG') {
                bubble.innerText = "새실로 찌르기 전에 다시 풀어라...";
                bubble.classList.add('panic');
                img.classList.add('emotion-wrong');
            } else {
                bubble.innerText = "공부 안 하고 뭐 하냐? 훗훗훗!";
            }
        }

        /* --- 3. 잔디밭(Heatmap) 생성기 --- */
        function renderHeatmap() {
            const grid = document.getElementById('heatmap-grid');
            grid.innerHTML = '';
            
            // 28일치 출석 데이터 시뮬레이션
            for (let i = 1; i <= 28; i++) {
                const cell = document.createElement('div');
                cell.className = 'heatmap-cell';
                cell.innerText = i;
                
                // 일부분을 무작위 학습 달성 레벨로 지정
                const rand = Math.random();
                if (i <= 14 || rand > 0.4) {
                    if (rand > 0.7) cell.classList.add('level-3');
                    else if (rand > 0.4) cell.classList.add('level-2');
                    else cell.classList.add('level-1');
                }
                grid.appendChild(cell);
            }
        }

        /* --- 4. 스무스 바텀 시트 토글 --- */
        function openBottomSheet(msg, exp, isSuccess) {
            const modal = document.getElementById('bottom-sheet-modal');
            const msgEl = document.getElementById('result-msg');
            const expEl = document.getElementById('result-exp');

            msgEl.innerText = msg;
            msgEl.style.color = isSuccess ? '#ff2a8d' : '#ef4444';
            expEl.innerText = exp;

            modal.classList.add('active');
        }

        function closeBottomSheet() {
            document.getElementById('bottom-sheet-modal').classList.remove('active');
        }

        /* --- 콤보 & 네비게이션 로직 --- */
        function updateComboUI() {
            const badge = document.getElementById('combo-badge');
            const mainContainer = document.querySelector('.container');

            if (comboCount >= 2) {
                badge.innerText = `🔥 ${comboCount} COMBO!`;
                badge.classList.add('show');
                if (comboCount >= 3) {
                    mainContainer.classList.add('hype-active');
                    updateDoflamingoMood('HYPED');
                }
            } else {
                badge.classList.remove('show');
                mainContainer.classList.remove('hype-active');
            }
        }

        function goToDaySelect() {
            document.getElementById('title-screen').classList.add('hidden');
            renderHeatmap();
            renderDayButtons();
            document.getElementById('day-screen').classList.remove('hidden');
        }

        function goToTitle() {
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
            updateDoflamingoMood('NORMAL');
        }

        function goToTitleFromQuiz() {
            clearInterval(quizTimerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
            updateDoflamingoMood('NORMAL');
        }

        function renderDayButtons() {
            const grid = document.getElementById('day-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 6; i++) {
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.innerText = `DAY ${i}`;
                if (i === 1) btn.onclick = () => startQuiz();
                grid.appendChild(btn);
            }
        }

        function startQuiz() {
            currentQuizIndex = 0;
            comboCount = 0;
            updateComboUI();
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion(currentQuizIndex);
        }

        function loadQuestion(index) {
            clearInterval(quizTimerInterval);
            quizTimeLeft = 20;
            document.getElementById('quiz-timer').innerText = quizTimeLeft;

            const q = questions[index];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-text').innerHTML = q.text;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = '';

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.label;
                btn.onclick = () => checkAnswer(opt.val);
                optionsContainer.appendChild(btn);
            });

            quizTimerInterval = setInterval(() => {
                quizTimeLeft--;
                document.getElementById('quiz-timer').innerText = quizTimeLeft;
                if (quizTimeLeft <= 5) updateDoflamingoMood('PANIC');
                if (quizTimeLeft <= 0) {
                    clearInterval(quizTimerInterval);
                    comboCount = 0;
                    updateComboUI();
                    updateDoflamingoMood('WRONG');
                    openBottomSheet("시간 초과!", "제한 시간이 초과되었습니다.", false);
                }
            }, 1000);
        }

        function checkAnswer(selectedOption) {
            clearInterval(quizTimerInterval);
            const q = questions[currentQuizIndex];

            if (selectedOption === q.correct) {
                isCorrectAnswer = true;
                comboCount++;
                updateComboUI();
                triggerFeatherBurst();
                openBottomSheet("도~황! 정답이다", q.explanation, true);
            } else {
                isCorrectAnswer = false;
                comboCount = 0;
                updateComboUI();
                updateDoflamingoMood('WRONG');
                openBottomSheet("틀렸다, 죽어!", "정답을 다시 확인해 보세요.", false);
            }
        }

        function handleNextAction() {
            closeBottomSheet();
            if (isCorrectAnswer) {
                currentQuizIndex++;
                if (currentQuizIndex < questions.length) {
                    loadQuestion(currentQuizIndex);
                } else {
                    goToTitleFromQuiz();
                }
            } else {
                loadQuestion(currentQuizIndex);
            }
        }
    </script>
</body>
