<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>도오링고 - 도오의 영어공부법</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="도오링고">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"도오링고","short_name":"도오링고","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#95e085","icons":[{"src":"smile.png","sizes":"192x192","type":"image/png"}]}'>
    
    <link rel="apple-touch-icon" href="smile.png">
    <link rel="icon" type="image/png" href="smile.png">
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.98);
            --primary-green: #95e085;
            --primary-green-dark: #6ebf5e;
            --primary-green-shadow: #529944;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --vh: 1vh;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(149, 224, 133, 0.3) 0%, rgba(149, 224, 133, 0) 70%);
            top: 5%;
            left: 5%;
            filter: blur(50px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(110, 191, 94, 0.2) 0%, rgba(110, 191, 94, 0) 70%);
            bottom: 5%;
            right: 5%;
            filter: blur(60px);
            z-index: 0;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 22px;
            border-radius: 32px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(149, 224, 133, 0.3);
            width: 380px;
            height: 680px;
            max-height: calc(var(--vh, 1vh) * 92);
            max-height: 92dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden; 
            z-index: 1;
        }

        .shake-animation {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .btn {
            background-color: var(--primary-green);
            color: #ffffff !important;
            border: 2px solid var(--primary-green-dark);
            padding: 13px 0;
            width: 100%;
            font-size: 17px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--primary-green-shadow);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            font-family: 'Pretendard', sans-serif;
            margin-top: 10px;
            flex-shrink: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            touch-action: manipulation;
        }

        .btn:active, .btn.touch-active {
            transform: translateY(4px) !important;
            box-shadow: 0 1px 0 var(--primary-green-shadow) !important;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--text-dark) !important;
            border: 2px solid #cbd5e1;
            box-shadow: 0 5px 0 #94a3b8;
            text-shadow: none;
        }

        .btn-secondary:active, .btn-secondary.touch-active {
            transform: translateY(4px) !important;
            box-shadow: 0 1px 0 #94a3b8 !important;
        }

        .intro-container {
            background: #ffffff;
            cursor: pointer;
        }
        
        .intro-text {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-green-dark);
            font-family: 'Poppins', 'Jua', sans-serif !important;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: introPopIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 4px 15px rgba(149, 224, 133, 0.4);
        }

        @keyframes introPopIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* --- 이름 설정 연출 커스텀 CSS --- */
        .doo-stage {
            position: relative;
            width: 100%;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
        }

        .ground-hole {
            position: absolute;
            bottom: 20px;
            width: 140px;
            height: 35px;
            background: #94a3b8;
            border-radius: 50%;
            transform: scale(0);
            box-shadow: inset 0 6px 10px rgba(0,0,0,0.3);
            z-index: 1;
        }

        @keyframes holeOpenClose {
            0% { transform: scaleX(0) scaleY(0); opacity: 0; }
            20% { transform: scaleX(1) scaleY(1); opacity: 1; }
            70% { transform: scaleX(1) scaleY(1); opacity: 1; }
            100% { transform: scaleX(0) scaleY(0); opacity: 0; }
        }

        .hole-anim {
            animation: holeOpenClose 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .doo-wrapper {
            position: absolute;
            bottom: 30px;
            z-index: 2;
            opacity: 0;
            transform: translateY(150px) scale(0.2) rotate(0deg);
        }

        @keyframes dooPopUpBounce {
            0% {
                opacity: 0;
                transform: translateY(150px) scale(0.2) rotate(0deg);
            }
            60% {
                opacity: 1;
                transform: translateY(-50px) scale(1.1) rotate(360deg);
            }
            80% {
                transform: translateY(10px) scale(0.95) rotate(360deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(360deg);
            }
        }

        .doo-pop-anim {
            animation: dooPopUpBounce 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes dooIdleGently {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .doo-idle-anim {
            animation: dooIdleGently 2.2s ease-in-out infinite;
        }

        .doo-image {
            width: 140px;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(149, 224, 133, 0.3));
        }

        .speech-bubble-anim {
            position: absolute;
            top: 10px;
            background: #ffffff;
            border: 2px solid rgba(149, 224, 133, 0.8);
            border-radius: 18px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            white-space: pre-wrap;
            word-break: keep-all;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            z-index: 10;
            opacity: 0;
            transform: scale(0.5) translateY(10px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .speech-bubble-anim::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 8px 0 8px;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        .speech-bubble-anim.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .speech-bubble-anim.hide {
            opacity: 0;
            transform: scale(0.5) translateY(10px);
        }

        .name-card-popup {
            width: 100%;
            background: #ffffff;
            border: 2px solid #c3f2b8;
            border-radius: 24px;
            padding: 20px 18px;
            box-shadow: 0 10px 25px rgba(149, 224, 133, 0.2);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .name-card-popup.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .name-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 6px;
        }
        .name-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 600;
        }
        .name-input-box {
            width: 100%;
            background: #ffffff;
            border: 2px solid #c3f2b8;
            border-radius: 18px;
            padding: 14px;
            font-size: 18px;
            font-weight: 800;
            text-align: center;
            color: var(--primary-green-dark);
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }
        .name-input-box:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(149, 224, 133, 0.25);
        }

        .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .character-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 48px;
        }

        .speech-bubble {
            position: absolute;
            top: -95px;
            background: #ffffff;
            border: 2px solid rgba(149, 224, 133, 0.5);
            border-radius: 18px;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-dark);
            white-space: pre-wrap;
            word-break: keep-all;
            width: max-content;
            max-width: 350px;
            line-height: 1.4;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            animation: bubbleBounce 2s infinite ease-in-out;
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 8px 0 8px;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .title-image {
            max-width: 150px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(149, 224, 133, 0.25));
        }
        .logo { 
            font-size: 28px; 
            font-weight: 800;
            color: var(--text-dark); 
            margin-bottom: 4px; 
            font-family: 'Pretendard', sans-serif;
        }
        .subtitle { 
            font-size: 14px; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            font-weight: 600;
        }

        #day-screen {
            padding: 20px 12px 16px 12px;
            justify-content: flex-start;
            background: #ffffff;
            position: relative;
        }

        .worldmap-scroll-container {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding: 20px 0 40px 0;
            -webkit-overflow-scrolling: touch;
            background: transparent;
            position: relative;
            scrollbar-width: none;
            z-index: 2;
        }
        .worldmap-scroll-container::-webkit-scrollbar { display: none; }

        .wave-bg {
            display: none;
        }

        .worldmap-path-wrapper {
            position: relative;
            width: 100%;
            min-height: 100%;
        }

        .island-node {
            position: absolute;
            width: 108px;
            height: 108px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-left: -54px;
        }

        .island-node:active, .island-node.touch-active {
            transform: scale(0.92) !important;
        }

        .island-node.unlocked {
            background: #c3f2b8; 
            box-shadow: 
                0 10px 0 #6ebf5e, 
                0 14px 22px rgba(110, 191, 94, 0.3),
                inset 0 2px 4px rgba(255,255,255,0.7);
            border: none;
        }

        .island-node.completed {
            background: #95e085;
            box-shadow: 
                0 10px 0 #529944, 
                0 12px 20px rgba(82, 153, 68, 0.3),
                inset 0 2px 4px rgba(255,255,255,0.8);
            border: none;
        }

        .island-node.locked {
            background: #cbd5e1;
            box-shadow: 
                0 8px 0 #475569, 
                0 6px 12px rgba(0,0,0,0.04);
            border: none;
            opacity: 0.85;
            cursor: not-allowed;
        }

        .island-node.latest-unlocked {
            animation: latestFloat 1.5s infinite ease-in-out;
        }

        @keyframes latestFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .island-node .stage-num {
            font-family: 'Poppins', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            line-height: 1;
        }
        
        .island-node.locked .stage-num {
            color: #ffffff;
            text-shadow: none;
        }

        .map-svg-layer {
            display: none;
        }

        .rule-card-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: rulePopIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes rulePopIn {
            0% {
                opacity: 0;
                transform: scale(0.85) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .rule-title { 
            font-size: 24px; 
            font-weight: 800;
            color: var(--text-dark); 
            margin-bottom: 20px; 
            letter-spacing: -0.5px;
        }

        .rule-box {
            background: linear-gradient(135deg, #ffffff 0%, #f4fbf2 100%);
            border-radius: 24px;
            padding: 28px 24px;
            width: 100%;
            text-align: left;
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 700;
            line-height: 1.8;
            margin-bottom: 24px;
            border: 2px solid #c3f2b8;
            box-shadow: 0 12px 24px rgba(149, 224, 133, 0.12);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .rule-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .rule-number {
            background: var(--primary-green);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 800;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 2px;
            box-shadow: 0 2px 6px rgba(110, 191, 94, 0.3);
        }

        .rule-text {
            flex: 1;
            font-size: 15px;
            color: var(--text-dark);
            line-height: 1.5;
        }

        .quiz-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quiz-enter-animation {
            animation: quizPopIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes quizPopIn {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .quiz-home-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            box-shadow: 0 3px 0 #94a3b8;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-dark);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        .quiz-home-btn:active, .quiz-home-btn.touch-active {
            transform: translateY(2px) !important;
            box-shadow: 0 1px 0 #94a3b8 !important;
        }

        .timer-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #f4fbf2;
            border: 2px solid #c3f2b8;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--primary-green-dark);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
        }
        .timer-badge svg { width: 14px; height: 14px; fill: var(--primary-green-dark); }

        .card-counter-badge {
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 800;
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.5px;
        }

        .question-title { 
            font-size: 14px; 
            font-weight: 800;
            color: var(--primary-green-dark); 
            text-align: left;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
        }

        .question-card {
            background: #ffffff;
            border: 2px solid var(--border-light);
            border-radius: 20px;
            padding: 20px 18px;
            text-align: left;
            box-shadow: 0 4px 0 #e2e8f0;
            margin-bottom: 16px;
        }

        .question-text { 
            font-size: 16px; 
            color: var(--text-dark); 
            line-height: 1.6; 
            font-weight: 600;
            word-break: keep-all;
        }
        
        .question-text u {
            color: var(--primary-green-dark);
            text-decoration-color: var(--primary-green-dark);
            text-underline-offset: 4px;
            font-weight: 800;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 100%; 
        }
        
        .option-btn {
            background: #ffffff;
            color: var(--text-dark) !important;
            border: 2px solid #cbd5e1;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            box-shadow: 0 4px 0 #cbd5e1;
            display: flex;
            align-items: center;
        }
        .option-btn:active, .option-btn.touch-active {
            transform: translateY(3px) !important;
            box-shadow: 0 1px 0 #cbd5e1 !important;
            background: #f4fbf2;
            border-color: var(--primary-green); 
            color: var(--primary-green-dark) !important;
        }

        .result-image {
            width: 85%;
            max-width: 280px;
            height: 220px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: none;
            object-fit: contain;
        }
        .result-text { font-size: 26px; font-weight: 800; margin-bottom: 8px; }

        .result-explanation {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 600;
            line-height: 1.6;
            background: #f4fbf2;
            border: 2px solid #c3f2b8;
            padding: 14px 16px;
            border-radius: 16px;
            white-space: pre-line;
            margin: 8px 0 12px 0;
            width: 100%;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }

        .review-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .flashcard-scene {
            width: 100%;
            height: 220px;
            margin: 16px 0;
            perspective: 1000px;
        }
        
        .flashcard {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 2px solid #c3f2b8;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-shadow: 0 6px 0 #c3f2b8;
            will-change: transform, opacity;
        }

        .card-flip-quick {
            animation: cardFlip 0.22s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .card-slide-next {
            animation: cardSlideOutIn 0.25s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes cardFlip {
            0% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(90deg) scale(0.92); }
            100% { transform: rotateY(0deg) scale(1); }
        }

        @keyframes cardSlideOutIn {
            0% { transform: translateX(0) scale(1); opacity: 1; }
            45% { transform: translateX(-80px) rotate(-6deg) scale(0.9); opacity: 0; }
            50% { transform: translateX(80px) rotate(6deg) scale(0.9); opacity: 0; }
            100% { transform: translateX(0) rotate(0deg) scale(1); opacity: 1; }
        }

        .card-content { font-size: 28px; color: var(--text-dark); font-weight: 800; word-break: break-all; text-align: center; }

        .settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            z-index: 200; opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.active { opacity: 1; pointer-events: auto; }

        .settings-modal {
            background: #ffffff;
            border-radius: 28px;
            width: 90%;
            max-width: 340px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .settings-header {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 4px;
        }

        .setting-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .setting-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .sheet-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            z-index: 100; opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .sheet-backdrop.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: fixed; left: 50%; bottom: 0;
            transform: translate(-50%, 100%);
            width: 100%; max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
            z-index: 101;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 16px 20px 24px 20px;
        }
        .bottom-sheet.active { transform: translate(-50%, 0); }

        .sheet-header {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            padding-bottom: 8px; cursor: grab; touch-action: none;
        }
        .sheet-handle {
            width: 40px; height: 4px; background: #e2e8f0; border-radius: 10px; margin-bottom: 12px;
        }
        
        .sheet-banner-text {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-green-dark);
            background: #f4fbf2;
            border: 1.5px solid #c3f2b8;
            padding: 8px 18px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .sheet-title { font-size: 18px; color: var(--text-dark); font-weight: 800; }

        .sheet-content { max-height: 50vh; overflow-y: auto; text-align: left; }
        .quick-word-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .quick-word-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background: #f8fafc; border-radius: 12px; font-size: 15px;
            border: 1px solid #e2e8f0;
        }
        .quick-word-item .word { font-weight: 700; color: var(--primary-green-dark); }
        .quick-word-item .meaning { color: var(--text-dark); font-weight: 600; }

        .hidden { display: none !important; }
    </style>
</head>

        function getDailyWordsByDate(targetDateObj) {
            const dateSeed = targetDateObj.getFullYear() * 10000 + (targetDateObj.getMonth() + 1) * 100 + targetDateObj.getDate();
            
            let pool = [...advancedDailyWordPool];
            let daily10 = [];

            let seed = dateSeed;
            function pseudoRandom() {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }

            for (let i = 0; i < 10; i++) {
                if (pool.length === 0) break;
                const randomIndex = Math.floor(pseudoRandom() * pool.length);
                daily10.push(pool.splice(randomIndex, 1)[0]);
            }
            return daily10;
        }

        function getDailyWords() {
            return getDailyWordsByDate(new Date());

        function getPassedDailyWords() {
            const firstVisitStr = localStorage.getItem('doolingo_first_visit_date');
            if (!firstVisitStr) return [];

            const firstVisit = new Date(firstVisitStr);
            const today = new Date();
            
            firstVisit.setHours(0,0,0,0);
            const yesterday = new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1, 0, 0, 0, 0);

            let accumulatedWords = [];
            let curr = new Date(firstVisit);

            while (curr <= yesterday) {
                const dayWords = getDailyWordsByDate(curr);
                accumulatedWords = accumulatedWords.concat(dayWords);
                curr.setDate(curr.getDate() + 1);
            }

            return accumulatedWords;
        }

        function checkStreakSystem() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let lastVisitDate = localStorage.getItem('doolingo_last_visit');
            let currentStreak = parseInt(localStorage.getItem('doolingo_streak') || '1', 10);

            if (!localStorage.getItem('doolingo_first_visit_date')) {
                localStorage.setItem('doolingo_first_visit_date', todayStr);
            }

            if (!lastVisitDate) {
                localStorage.setItem('doolingo_last_visit', todayStr);
                localStorage.setItem('doolingo_streak', '1');
                return 1;
            }

            const diffDays = Math.round((new Date(todayStr) - new Date(lastVisitDate)) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) {
                currentStreak += 1;
                localStorage.setItem('doolingo_streak', currentStreak.toString());
                localStorage.setItem('doolingo_last_visit', todayStr);
            } else if (diffDays > 1) {
                currentStreak = 1;
                localStorage.setItem('doolingo_streak', '1');
                localStorage.setItem('doolingo_last_visit', todayStr);
            }
            return currentStreak;
        }

        function renderWorldMapDays() {
            const pathWrapper = document.getElementById('worldmap-path');
            const svgLayer = document.getElementById('map-svg-layer');
            
            pathWrapper.querySelectorAll('.island-node').forEach(node => node.remove());
            svgLayer.innerHTML = '';

            const totalStages = 30;
            const containerWidth = 330; 
            const startY = 70;
            const rowGap = 170;

            const nodesData = [];

            for (let i = 1; i <= totalStages; i++) {
                const offsetX = Math.sin(i * 0.85) * 85 + Math.cos(i * 0.4) * 20; 
                const posX = (containerWidth / 2) + offsetX;
                const posY = startY + (i - 1) * rowGap;

                nodesData.push({ id: i, x: posX, y: posY });
            }

            const totalHeight = startY + totalStages * rowGap + 60;
            pathWrapper.style.height = `${totalHeight}px`;

            let highestUnlockedId = -1;
            for (let i = 1; i <= totalStages; i++) {
                const isCompleted = localStorage.getItem(`doolingo_day${i}_completed`) === 'true';
                const hasQuestions = Boolean(allQuestions[`day${i}`] && allQuestions[`day${i}`].length > 0);
                if (hasQuestions && !isCompleted) {
                    highestUnlockedId = i;
                }
            }

            nodesData.forEach(data => {
                const i = data.id;
                const isCompleted = localStorage.getItem(`doolingo_day${i}_completed`) === 'true';
                const hasQuestions = Boolean(allQuestions[`day${i}`] && allQuestions[`day${i}`].length > 0);

                const node = document.createElement('div');
                let statusClass = 'locked';

                if (hasQuestions) {
                    if (isCompleted) {
                        statusClass = 'completed';
                    } else {
                        statusClass = 'unlocked';
                        if (i === highestUnlockedId) {
                            statusClass += ' latest-unlocked';
                        }
                    }
                }

                node.className = `island-node ${statusClass}`;
                node.style.left = `${data.x}px`;
                node.style.top = `${data.y - 54}px`;

                const formattedNum = String(i).padStart(2, '0');
                node.innerHTML = `
                    <span class="stage-num">${formattedNum}</span>
                `;

                if (hasQuestions) {
                    node.onclick = () => { selectDay(i); };
                } else {
                    node.onclick = () => { playButtonSound(); alert('아직 열리지 않은 단계입니다!'); };
                }

                pathWrapper.appendChild(node);
            });
        }

        function updateFlashcardContent(animated = false, animType = '') {
            clearInterval(reviewTimerInterval);
            reviewTimeLeft = 5;
            document.getElementById('review-timer').innerText = reviewTimeLeft;

            document.getElementById('card-counter').innerText = `${currentReviewIndex + 1} / ${activeFlashcards.length}`;

            const flashcardEl = document.getElementById('flashcard');
            const cardText = document.getElementById('card-text');
            const reviewBtn = document.getElementById('review-btn');
            const card = activeFlashcards[currentReviewIndex];

            const renderData = () => {
                if (!isShowingMeaning) {
                    cardText.innerText = card.word;
                    cardText.style.color = "var(--text-dark)";
                    reviewBtn.innerText = "정답 확인";
                } else {
                    cardText.innerText = card.meaning;
                    cardText.style.color = "var(--primary-green-dark)";
                    reviewBtn.innerText = (currentReviewIndex === activeFlashcards.length - 1) ? "학습 완료" : "다음 단어";
                }
            };

            if (animated) {
                isCardAnimating = true;
                flashcardEl.classList.remove('card-flip-quick', 'card-slide-next');
                void flashcardEl.offsetWidth;

                if (animType === 'flip') {
                    flashcardEl.classList.add('card-flip-quick');
                    setTimeout(() => { renderData(); }, 110);
                    setTimeout(() => { 
                        flashcardEl.classList.remove('card-flip-quick');
                        isCardAnimating = false; 
                    }, 220);
                } else if (animType === 'slide') {
                    flashcardEl.classList.add('card-slide-next');
                    setTimeout(() => { renderData(); }, 125);
                    setTimeout(() => { 
                        flashcardEl.classList.remove('card-slide-next');
                        isCardAnimating = false; 
                    }, 250);
                }
            } else {
                renderData();
            }

            reviewTimerInterval = setInterval(() => {
                reviewTimeLeft--;
                document.getElementById('review-timer').innerText = reviewTimeLeft;
                if (reviewTimeLeft <= 0) {
                    clearInterval(reviewTimerInterval);
                    handleReviewAction();
                }
            }, 1000);
        }

        function handleReviewAction() {
            if (isCardAnimating) return;

            clearInterval(reviewTimerInterval);
            if (!isShowingMeaning) {
                isShowingMeaning = true;
                updateFlashcardContent(true, 'flip');
            } else {
                currentReviewIndex++;
                if (currentReviewIndex < activeFlashcards.length) {
                    isShowingMeaning = false;
                    updateFlashcardContent(true, 'slide');
                } else {
                    if (currentSelectedDay) {
                        localStorage.setItem(`doolingo_day${currentSelectedDay}_completed`, 'true');
                    }
                    triggerCompletionEffects();
                }
            }
        }

        }

        function returnToMainFromComplete() {
            document.getElementById('complete-screen').classList.remove('hidden');
            document.getElementById('complete-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        const bottomSheet = document.getElementById('bottom-sheet');
        const sheetBackdrop = document.getElementById('sheet-backdrop');

        function openBottomSheet() {
            sheetBackdrop.classList.add('active');
            bottomSheet.classList.add('active');
            playSoundFile('ping.mp3');
        }

        function closeBottomSheet() {
            bottomSheet.classList.remove('active');
            sheetBackdrop.classList.remove('active');
        }

        function openQuickWordSheet() {
            const dailyWords = getDailyWords();
            let htmlList = '<div class="quick-word-list">';
            dailyWords.forEach(item => {
                htmlList += `<div class="quick-word-item"><span class="word">${item.word}</span><span class="meaning">${item.meaning}</span></div>`;
            });
            htmlList += '</div>';

            document.getElementById('sheet-content').innerHTML = htmlList;
            openBottomSheet();
        }

        function initBottomSheetEvents() {
            let startY = 0;
            const header = document.getElementById('sheet-header');
            header.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
            header.addEventListener('touchend', (e) => {
                if (e.changedTouches[0].clientY - startY > 50) closeBottomSheet();
            });
        }
    </script>
</body>
</html>
