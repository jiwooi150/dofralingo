<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>도플라링고 - 도황의 영어공부법</title>
    
    <!-- 모바일 전체화면(주소창 감추기 & PWA) 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="도플라링고">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    
    <link rel="manifest" href='data:application/manifest+json,{"name":"도플라링고","short_name":"도플라링고","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#ec4899","icons":[{"src":"title.png","sizes":"192x192","type":"image/png"}]}'>
    
    <link rel="apple-touch-icon" href="title.png">
    <link rel="icon" type="image/png" href="title.png">
    
    <!-- Pretendard & Poppins & Jua 웹폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.98);
            --primary-pink: #ec4899;
            --primary-pink-dark: #be185d;
            --primary-pink-shadow: #9d174d;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-light: #e2e8f0;
            --vh: 1vh;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(251, 207, 232, 0.4) 0%, rgba(251, 207, 232, 0) 70%);
            top: 5%;
            left: 5%;
            filter: blur(50px);
            z-index: 0;
        }
        body::after {
            content: '';
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(244, 114, 182, 0.25) 0%, rgba(244, 114, 182, 0) 70%);
            bottom: 5%;
            right: 5%;
            filter: blur(60px);
            z-index: 0;
        }

        .container {
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 24px 22px;
            border-radius: 32px;
            box-shadow: 
                0 20px 40px rgba(0, 0, 0, 0.06),
                0 0 0 1px rgba(244, 114, 182, 0.2);
            width: 380px;
            height: 680px;
            max-height: calc(var(--vh, 1vh) * 92);
            max-height: 92dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden; 
            z-index: 1;
        }

        .btn {
            background-color: var(--primary-pink);
            color: #ffffff !important;
            border: 2px solid var(--primary-pink-dark);
            padding: 13px 0;
            width: 100%;
            font-size: 17px;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            box-shadow: 0 5px 0 var(--primary-pink-shadow);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            font-family: 'Pretendard', sans-serif;
            margin-top: 10px;
            flex-shrink: 0;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            touch-action: manipulation;
        }

        .btn:active, .btn.touch-active {
            transform: translateY(4px) !important;
            box-shadow: 0 1px 0 var(--primary-pink-shadow) !important;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: var(--text-dark) !important;
            border: 2px solid #cbd5e1;
            box-shadow: 0 5px 0 #94a3b8;
            text-shadow: none;
        }

        .btn-secondary:active, .btn-secondary.touch-active {
            transform: translateY(4px) !important;
            box-shadow: 0 1px 0 #94a3b8 !important;
        }

        .intro-container {
            background: #fdf2f8;
            cursor: pointer;
        }
        .intro-text {
            font-size: 42px;
            font-weight: 800;
            color: var(--primary-pink);
            font-family: 'Poppins', 'Jua', sans-serif !important;
            letter-spacing: -0.5px;
            opacity: 0;
            animation: slideFadeIn 1s ease forwards;
            text-shadow: 0 2px 10px rgba(236, 72, 153, 0.2);
        }

        @keyframes slideFadeIn {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .name-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .name-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 600;
        }
        .name-input-box {
            width: 100%;
            background: #ffffff;
            border: 2px solid #fbcfe8;
            border-radius: 18px;
            padding: 16px;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            color: var(--primary-pink-dark);
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }
        .name-input-box:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.15);
        }

        .title-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .character-area {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
            margin-top: 20px;
        }

        .speech-bubble {
            position: absolute;
            top: -58px;
            background: #ffffff;
            border: 2px solid rgba(236, 72, 153, 0.3);
            border-radius: 18px;
            padding: 8px 16px;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
            white-space: pre-wrap;
            word-break: keep-all;
            max-width: 260px;
            line-height: 1.35;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
            animation: bubbleBounce 2s infinite ease-in-out;
            z-index: 10;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 7px 0 7px;
            border-style: solid;
            border-color: #ffffff transparent;
            display: block;
            width: 0;
        }

        @keyframes bubbleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .title-image {
            max-width: 150px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 8px 16px rgba(236, 72, 153, 0.15));
        }
        .logo { 
            font-size: 28px; 
            font-weight: 800;
            color: var(--text-dark); 
            margin-bottom: 4px; 
            font-family: 'Pretendard', sans-serif;
        }
        .subtitle { 
            font-size: 14px; 
            color: var(--text-muted); 
            margin-bottom: 12px; 
            font-weight: 600;
        }

        #day-screen {
            padding: 24px 12px 16px 12px;
            justify-content: flex-start;
        }

        .streak-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: #fdf2f8;
            border: 2px solid #fbcfe8;
            color: var(--primary-pink-dark);
            font-size: 14px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .island-scroll-container {
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            -webkit-overflow-scrolling: touch;
        }

        .day-island {
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid var(--border-light);
            box-shadow: 0 4px 0 #cbd5e1;
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }

        .day-island:active, .day-island.touch-active { 
            transform: translateY(3px) !important;
            box-shadow: 0 1px 0 #cbd5e1 !important;
        }

        .day-island-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            font-family: 'Poppins', sans-serif;
        }

        .day-island-sub { font-size: 13px; color: var(--text-muted); font-weight: 600; }

        .day-island-status {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #fdf2f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--primary-pink);
            font-weight: 700;
        }

        .day-island.completed {
            background: #fdf2f8;
            border-color: #fbcfe8;
            box-shadow: 0 4px 0 #f472b6;
        }
        .day-island.completed .day-island-status {
            background: var(--primary-pink);
            color: white;
        }

        .day-island.locked {
            opacity: 0.6;
            background: #f8fafc;
            cursor: not-allowed;
            box-shadow: 0 4px 0 #e2e8f0;
        }

        .rule-title { 
            font-size: 22px; 
            font-weight: 800;
            color: var(--text-dark); 
            margin-bottom: 16px; 
        }
        .rule-box {
            background: #fdf2f8;
            border-radius: 20px;
            padding: 24px 20px;
            width: 100%;
            text-align: left;
            font-size: 15px;
            color: var(--text-dark);
            font-weight: 600;
            line-height: 1.8;
            margin-bottom: 20px;
            border: 2px solid #fbcfe8;
        }

        .quiz-content-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 12px;
        }

        .quiz-home-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            box-shadow: 0 3px 0 #94a3b8;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-dark);
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }
        .quiz-home-btn:active, .quiz-home-btn.touch-active {
            transform: translateY(2px) !important;
            box-shadow: 0 1px 0 #94a3b8 !important;
        }

        .timer-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #fdf2f8;
            border: 2px solid #fbcfe8;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--primary-pink);
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
        }
        .timer-badge svg { width: 14px; height: 14px; fill: var(--primary-pink); }

        .question-title { 
            font-size: 14px; 
            font-weight: 800;
            color: var(--primary-pink); 
            text-align: left;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Poppins', sans-serif;
        }

        .question-card {
            background: #ffffff;
            border: 2px solid var(--border-light);
            border-radius: 20px;
            padding: 20px 18px;
            text-align: left;
            box-shadow: 0 4px 0 #e2e8f0;
            margin-bottom: 16px;
        }

        .question-text { 
            font-size: 16px; 
            color: var(--text-dark); 
            line-height: 1.6; 
            font-weight: 600;
            word-break: keep-all;
        }
        
        .question-text u {
            color: var(--primary-pink);
            text-decoration-color: var(--primary-pink);
            text-underline-offset: 4px;
            font-weight: 800;
        }

        .options { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 100%; 
        }
        
        .option-btn {
            background: #ffffff;
            color: var(--text-dark) !important;
            border: 2px solid #cbd5e1;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            text-align: left;
            transition: transform 0.05s ease, box-shadow 0.05s ease;
            box-shadow: 0 4px 0 #cbd5e1;
            display: flex;
            align-items: center;
        }
        .option-btn:active, .option-btn.touch-active {
            transform: translateY(3px) !important;
            box-shadow: 0 1px 0 #cbd5e1 !important;
            background: #fdf2f8;
            border-color: var(--primary-pink); 
            color: var(--primary-pink) !important;
        }

        .result-image {
            width: 85%;
            max-width: 280px;
            height: 220px;
            border-radius: 20px;
            margin-bottom: 12px;
            display: none;
            object-fit: contain;
        }
        .result-text { font-size: 24px; font-weight: 800; margin-bottom: 8px; }

        .result-explanation {
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 600;
            line-height: 1.6;
            background: #fdf2f8;
            border: 2px solid #fbcfe8;
            padding: 14px 16px;
            border-radius: 16px;
            white-space: pre-line;
            margin: 8px 0 12px 0;
            width: 100%;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }

        .review-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .flashcard-scene {
            width: 100%;
            height: 220px;
            margin: 16px 0;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            background: #ffffff;
            border: 2px solid #fbcfe8;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-shadow: 0 6px 0 #fbcfe8;
        }

        .card-label { font-size: 13px; color: var(--primary-pink); margin-bottom: 8px; font-weight: 800; font-family: 'Poppins', sans-serif; }
        .card-content { font-size: 28px; color: var(--text-dark); font-weight: 800; word-break: break-all; }

        .settings-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            z-index: 200; opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .settings-overlay.active { opacity: 1; pointer-events: auto; }

        .settings-modal {
            background: #ffffff;
            border-radius: 28px;
            width: 90%;
            max-width: 340px;
            padding: 24px 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .settings-header {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 4px;
        }

        .setting-item {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .setting-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #cbd5e1;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 20px; width: 20px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-pink); }
        input:checked + .slider:before { transform: translateX(20px); }

        .sheet-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.4);
            z-index: 100; opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .sheet-backdrop.active { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: fixed; left: 50%; bottom: 0;
            transform: translate(-50%, 100%);
            width: 100%; max-width: 420px;
            background: #ffffff;
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
            z-index: 101;
            transition: transform 0.3s ease;
            padding: 16px 20px 24px 20px;
        }
        .bottom-sheet.active { transform: translate(-50%, 0); }

        .sheet-header {
            width: 100%; display: flex; flex-direction: column; align-items: center;
            padding-bottom: 8px; cursor: grab; touch-action: none;
        }
        .sheet-handle {
            width: 40px; height: 4px; background: #e2e8f0; border-radius: 10px; margin-bottom: 12px;
        }
        .sheet-title { font-size: 18px; color: var(--text-dark); font-weight: 800; }

        .sheet-content { max-height: 50vh; overflow-y: auto; text-align: left; }
        .quick-word-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
        .quick-word-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background: #f8fafc; border-radius: 12px; font-size: 15px;
            border: 1px solid #e2e8f0;
        }
        .quick-word-item .word { font-weight: 700; color: var(--primary-pink-dark); }
        .quick-word-item .meaning { color: var(--text-dark); font-weight: 600; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 0. 인트로 화면 -->
    <div id="intro-screen" class="container intro-container" onclick="skipIntro()">
        <div class="intro-text">Doflalingo</div>
    </div>

    <!-- 0.5. 이름 설정 화면 -->
    <div id="name-screen" class="container hidden">
        <div class="name-title">이름을 설정해 주세요</div>
        <div class="name-subtitle">한글 최대 3자까지 입력 가능합니다.</div>
        <input type="text" id="username-input" class="name-input-box" placeholder="이름 입력" maxlength="3">
        <button class="btn" style="margin-top: 24px;" onclick="saveUserName()">시작하기</button>
    </div>

    <!-- 1. 타이틀 화면 -->
    <div id="title-screen" class="container hidden">
        <div class="title-wrapper">
            <div class="character-area">
                <div id="speech-bubble" class="speech-bubble">공부 안 하고 뭐 하냐?\n훗훗훗!</div>
                <img src="title.png" alt="타이틀 이미지" class="title-image" onerror="this.style.visibility='hidden';">
            </div>
            <div class="logo">도플라링고</div>
            <div class="subtitle">도황의 영어공부법</div>
            <button class="btn" onclick="playButtonSound(); goToDaySelect()">일일 과제</button>
            <button class="btn btn-secondary" onclick="playButtonSound(); startVocabularyDeck()">단어장</button>
            <button class="btn" style="background: #8b5cf6; border-color: #6d28d9; box-shadow: 0 5px 0 #5b21b6;" onclick="playButtonSound(); openQuickWordSheet()">⚡ 오늘의 단어</button>
            <button class="btn btn-secondary" onclick="playButtonSound(); openSettings()">설정 ⚙️</button>
        </div>
    </div>

    <!-- 2. DAY 선택 화면 -->
    <div id="day-screen" class="container hidden">
        <div id="streak-badge" class="streak-badge">🔥 연속 출석: 1일째</div>
        <div id="island-container" class="island-scroll-container"></div>
        <button class="btn btn-secondary" style="margin-top: 12px;" onclick="playButtonSound(); goToTitle()">메인으로</button>
    </div>

    <!-- 3. 문제풀이 규칙 화면 -->
    <div id="rule-screen" class="container hidden">
        <div class="rule-title">문제풀이 규칙</div>
        <div class="rule-box">
            1. 보기 먼저 확인하기<br><br>
            2. 명사/동사 위치 구분하기<br><br>
            3. 모르면 울지 말고 근거 있게 찍기
        </div>
        <button class="btn" onclick="playButtonSound(); startQuiz()">문제 풀기</button>
    </div>

    <!-- 4. 퀴즈 화면 -->
    <div id="quiz-screen" class="container hidden">
        <div id="quiz-wrapper" class="quiz-content-wrapper">
            <div>
                <div class="quiz-top-bar">
                    <button class="quiz-home-btn" onclick="playButtonSound(); goToTitleFromQuiz()">🏠 메인</button>
                    <div class="timer-badge">
                        <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 12,22A10,10 0 0,0 12,4M12.5,7H11V13L16.25,16.15L17,14.92L12.5,12.25V7Z"/></svg>
                        <span id="quiz-timer">20</span>초
                    </div>
                </div>
                
                <div id="q-title" class="question-title">QUESTION 01</div>
                
                <div class="question-card">
                    <div id="q-text" class="question-text"></div>
                </div>
            </div>

            <div id="q-options" class="options"></div>
        </div>
    </div>

    <!-- 5. 결과 화면 -->
    <div id="result-screen" class="container hidden">
        <img id="result-img" class="result-image" src="" alt="결과 이미지" onerror="this.style.display='none';">
        <div id="result-msg" class="result-text"></div>
        <div id="result-exp" class="result-explanation hidden"></div>
        <button id="action-btn" class="btn" onclick="playButtonSound(); handleNextAction()">다음</button>
    </div>

    <!-- 6. 단어 복습 화면 -->
    <div id="review-screen" class="container hidden">
        <div class="review-container">
            <div class="quiz-top-bar">
                <button class="quiz-home-btn" onclick="playButtonSound(); goToTitleFromReview()">🏠 메인</button>
                <div class="timer-badge">
                    <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 12,4M12.5,7H11V13L16.25,16.15L17,14.92L12.5,12.25V7Z"/></svg>
                    <span id="review-timer">5</span>초
                </div>
            </div>
            
            <div class="flashcard-scene">
                <div id="flashcard" class="flashcard">
                    <div id="card-label" class="card-label">WORD</div>
                    <div id="card-text" class="card-content"></div>
                </div>
            </div>
            
            <button id="review-btn" class="btn" onclick="playButtonSound(); handleReviewAction()">정답 확인</button>
        </div>
    </div>

    <!-- 7. 최종 완료 화면 -->
    <div id="complete-screen" class="container hidden">
        <img src="complete.gif" alt="완료 이미지" style="width: 220px; height: 220px; object-fit: contain; border-radius: 16px; margin-bottom: 12px;" onerror="this.style.display='none';">
        <div style="font-size: 22px; font-weight: 800; color: var(--text-dark); margin-bottom: 4px;">학습 완료!</div>
        <div class="subtitle">토익 해적단 토벌 완료.</div>
        <button class="btn" onclick="playButtonSound(); returnToMainFromComplete()">메인으로</button>
    </div>

    <!-- 설정 모달 패널 -->
    <div id="settings-overlay" class="settings-overlay">
        <div class="settings-modal">
            <div class="settings-header">설정 ⚙️</div>
            
            <div class="setting-item">
                <div class="setting-label">닉네임 변경</div>
                <input type="text" id="edit-username-input" class="name-input-box" style="font-size: 16px; padding: 10px;" maxlength="3">
                <button class="btn" style="margin-top: 0; padding: 10px 0; font-size: 15px;" onclick="updateUserName()">닉네임 저장</button>
            </div>

            <div class="setting-item">
                <div class="setting-label">
                    <span>효과음</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="sound-toggle" onchange="toggleSoundSetting(this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-item">
                <div class="setting-label">진행 사항 초기화</div>
                <button class="btn" style="background: #ef4444; border-color: #b91c1c; box-shadow: 0 4px 0 #991b1b; margin-top: 0; padding: 10px 0; font-size: 15px;" onclick="resetAllData()">전체 데이터 초기화</button>
            </div>

            <button class="btn btn-secondary" style="margin-top: 4px; padding: 10px 0; font-size: 15px;" onclick="closeSettings()">닫기</button>
        </div>
    </div>

    <!-- 바텀 시트 -->
    <div id="sheet-backdrop" class="sheet-backdrop" onclick="closeBottomSheet()"></div>
    
    <div id="bottom-sheet" class="bottom-sheet">
        <div class="sheet-header" id="sheet-header">
            <div class="sheet-handle"></div>
            <div class="sheet-title" id="sheet-title">오늘의 단어 ⚡</div>
        </div>
        <div class="sheet-content" id="sheet-content"></div>
    </div>

    <script>
        const questions = [
            {
                number: 1,
                title: "QUESTION 01",
                text: "To attract young consumers, promoting new products online is more <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> than advertising on television.",
                options: [
                    { label: "(A) effects", val: "A" },
                    { label: "(B) effectively", val: "B" },
                    { label: "(C) effecting", val: "C" },
                    { label: "(D) effective", val: "D" }
                ],
                correct: "D",
                explanation: "💡 해설\nmore 뒤에는 형용사가 올 수 있습니다."
            },
            {
                number: 2,
                title: "QUESTION 02",
                text: "Twins Excursions employs licensed guides who <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> tours in five different languages.",
                options: [
                    { label: "(A) conduct", val: "A" },
                    { label: "(B) receive", val: "B" },
                    { label: "(C) inspect", val: "C" },
                    { label: "(D) distribute", val: "D" }
                ],
                correct: "A",
                explanation: "💡 해설\nconduct = 안내하다, 수행하다\ninspect = 검사하다\ndistribute = 분배하다"
            },
            {
                number: 3,
                title: "QUESTION 03",
                text: "Director Philip Anderson's movie Silent Moon received a <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> for the Best Film Award this year.",
                options: [
                    { label: "(A) nomination", val: "A" },
                    { label: "(B) subscription", val: "B" },
                    { label: "(C) destination", val: "C" },
                    { label: "(D) creation", val: "D" }
                ],
                correct: "A",
                explanation: "💡 해설\nnomination = 수상 후보, 지명\nsubscription = 구독"
            },
            {
                number: 4,
                title: "QUESTION 04",
                text: "During peak shopping seasons, Johnson's Sportswear provides additional staff training to ensure an <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> workforce.",
                options: [
                    { label: "(A) experienced", val: "A" },
                    { label: "(B) experiencing", val: "B" },
                    { label: "(C) experiences", val: "C" },
                    { label: "(D) experience", val: "D" }
                ],
                correct: "A",
                explanation: "💡 해설\nworkforce(직원)를 수식하는 형용사 필요\nexperienced workforce = 숙련된 직원"
            },
            {
                number: 5,
                title: "QUESTION 05",
                text: "Only staff employed for more than 15 years are <u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u> to receive an Excellent Worker Award.",
                options: [
                    { label: "(A) accountable", val: "A" },
                    { label: "(B) modified", val: "B" },
                    { label: "(C) entitled", val: "C" },
                    { label: "(D) important", val: "D" }
                ],
                correct: "C",
                explanation: "💡 해설\nentitled = 자격이 있는 (be entitled to)"
            }
        ];

        const allDayFlashcards = {
            day1: [
                { word: "Formerly", meaning: "이전에" },
                { word: "withdraw", meaning: "철회하다" },
                { word: "aside", meaning: "따로" },
                { word: "representation", meaning: "대표단" },
                { word: "along with", meaning: "함께" },
                { word: "owing to", meaning: "~때문에" },
                { word: "despite", meaning: "~불구하고" },
                { word: "in order that", meaning: "~할 수 있도록" },
                { word: "now that", meaning: "~이므로" },
                { word: "recession", meaning: "불경기" }
            ],
        };

        const randomTaunts = [
            "${userName}, 아직도 그 모양인가?\n훗훗훗... 공부 안 해?",
            "오호, ${userName}. 그 머리로\n영어 공부를 하겠다고?",
            "${userName}, 단어 몇 개 외운다고\n네 인생이 바뀔 것 같나?",
            "훗훗훗... ${userName}, 또 틀릴\n준비는 되었나?",
            "덤벼라 ${userName}! 네 무지가\n어디까지 가나 구경하지!"
        ];

        let currentQuizIndex = 0;
        let isCorrectAnswer = false;
        let activeFlashcards = []; 
        let currentReviewIndex = 0;
        let isShowingMeaning = false;
        let introTimer = null;
        let hasIntroPassed = false;
        
        let quizTimerInterval = null;
        let quizTimeLeft = 20;

        let reviewTimerInterval = null;
        let reviewTimeLeft = 5;

        // 전체화면 요청 함수 (주소창 숨기기)
        function requestFullScreen() {
            const doc = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(() => {});
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen();
                }
            }
        }

        function initViewport() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
            window.scrollTo(0, 1);
        }

        function preloadImages() {
            ['title.png', 'correct.gif', 'wrong.png', 'complete.gif'].forEach(src => {
                const img = new Image(); img.src = src;
            });
        }

        function setupTouchFeedback() {
            const targets = '.btn, .day-island, .quiz-home-btn, .option-btn';
            
            document.addEventListener('touchstart', (e) => {
                requestFullScreen(); // 터치 시 주소창 자동 숨김/전체화면 진입
                const target = e.target.closest(targets);
                if (target) {
                    target.classList.add('touch-active');
                }
            }, { passive: true });

            document.addEventListener('touchend', (e) => {
                const target = e.target.closest(targets);
                if (target) {
                    setTimeout(() => target.classList.remove('touch-active'), 80);
                }
            }, { passive: true });

            document.addEventListener('touchcancel', (e) => {
                const target = e.target.closest(targets);
                if (target) {
                    target.classList.remove('touch-active');
                }
            }, { passive: true });

            document.addEventListener('click', () => {
                requestFullScreen(); // 첫 클릭 시 전체화면 시도
            }, { once: true });
        }

        function checkStreakSystem() {
            const todayStr = new Date().toISOString().slice(0, 10);
            let lastVisitDate = localStorage.getItem('dofla_last_visit');
            let currentStreak = parseInt(localStorage.getItem('dofla_streak') || '1', 10);

            if (!lastVisitDate) {
                localStorage.setItem('dofla_last_visit', todayStr);
                localStorage.setItem('dofla_streak', '1');
                return 1;
            }

            const diffDays = Math.round((new Date(todayStr) - new Date(lastVisitDate)) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) {
                currentStreak += 1;
                localStorage.setItem('dofla_streak', currentStreak.toString());
                localStorage.setItem('dofla_last_visit', todayStr);
            } else if (diffDays > 1) {
                currentStreak = 1;
                localStorage.setItem('dofla_streak', '1');
                localStorage.setItem('dofla_last_visit', todayStr);
            }
            return currentStreak;
        }

        function playSoundFile(filename) {
            const soundEnabled = localStorage.getItem('dofla_sound_enabled') !== 'false';
            if (!soundEnabled) return;

            try {
                const audio = new Audio(filename);
                audio.currentTime = 0;
                audio.play().catch(() => {});
            } catch(e) {}
        }

        function playButtonSound() {
            playSoundFile('1.mp3');
        }

        window.onload = function() {
            preloadImages();
            initViewport();
            setupTouchFeedback();
            checkStreakSystem();
            playSoundFile('start.mp3');

            introTimer = setTimeout(() => { transitionNext(); }, 2500);
            initBottomSheetEvents();
        };

        window.addEventListener('resize', initViewport);
        window.addEventListener('orientationchange', () => setTimeout(initViewport, 200));

        function skipIntro() {
            if (hasIntroPassed) return;
            hasIntroPassed = true;
            clearTimeout(introTimer);
            transitionNext();
        }

        function transitionNext() {
            hasIntroPassed = true;
            document.getElementById('intro-screen').classList.add('hidden');
            
            const savedName = localStorage.getItem('dofla_username');
            if (!savedName) {
                document.getElementById('name-screen').classList.remove('hidden');
            } else {
                showTitleScreen(savedName);
            }
        }

        function saveUserName() {
            const nameInput = document.getElementById('username-input').value.trim();
            const koreanRegex = /^[가-힣]{1,3}$/;

            if (!koreanRegex.test(nameInput)) {
                alert('이름은 한글로 최대 3자까지만 입력이 가능합니다.');
                return;
            }

            playButtonSound();
            localStorage.setItem('dofla_username', nameInput);
            document.getElementById('name-screen').classList.add('hidden');
            showTitleScreen(nameInput);
        }

        function showTitleScreen(userName) {
            const rawTaunt = randomTaunts[Math.floor(Math.random() * randomTaunts.length)];
            const formattedTaunt = rawTaunt.replace(/\${userName}/g, userName);
            document.getElementById('speech-bubble').innerText = formattedTaunt;
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function openSettings() {
            const savedName = localStorage.getItem('dofla_username') || '';
            const soundEnabled = localStorage.getItem('dofla_sound_enabled') !== 'false';
            
            document.getElementById('edit-username-input').value = savedName;
            document.getElementById('sound-toggle').checked = soundEnabled;
            
            document.getElementById('settings-overlay').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-overlay').classList.remove('active');
        }

        function updateUserName() {
            const nameInput = document.getElementById('edit-username-input').value.trim();
            const koreanRegex = /^[가-힣]{1,3}$/;

            if (!koreanRegex.test(nameInput)) {
                alert('이름은 한글로 최대 3자까지만 입력이 가능합니다.');
                return;
            }

            playButtonSound();
            localStorage.setItem('dofla_username', nameInput);
            showTitleScreen(nameInput);
            alert('닉네임이 변경되었습니다.');
            closeSettings();
        }

        function toggleSoundSetting(enabled) {
            localStorage.setItem('dofla_sound_enabled', enabled ? 'true' : 'false');
            if (enabled) playButtonSound();
        }

        function resetAllData() {
            if (confirm('정말로 모든 데이터와 진행 상황을 초기화하시겠습니까?')) {
                localStorage.clear();
                alert('모든 데이터가 초기화되었습니다.');
                location.reload();
            }
        }

        function goToTitle() {
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToTitleFromQuiz() {
            clearInterval(quizTimerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToTitleFromReview() {
            clearInterval(reviewTimerInterval);
            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        function goToDaySelect() {
            document.getElementById('title-screen').classList.add('hidden');
            renderIslandDays();
            document.getElementById('day-screen').classList.remove('hidden');
        }

        function startVocabularyDeck() {
            let combined = [];
            for (let dayKey in allDayFlashcards) {
                combined = combined.concat(allDayFlashcards[dayKey]);
            }
            activeFlashcards = combined.sort(() => Math.random() - 0.5);
            document.getElementById('title-screen').classList.add('hidden');
            startReview();
        }

        function renderIslandDays() {
            const container = document.getElementById('island-container');
            container.innerHTML = '';
            const isDay1Completed = localStorage.getItem('dofla_day1_completed') === 'true';
            document.getElementById('streak-badge').innerHTML = `🔥 연속 출석: ${localStorage.getItem('dofla_streak') || '1'}일째`;

            for (let i = 1; i <= 30; i++) {
                const island = document.createElement('div');
                if (i === 1) {
                    island.className = isDay1Completed ? 'day-island completed' : 'day-island';
                    island.innerHTML = `
                        <div>
                            <div class="day-island-title">DAY 01</div>
                            <div class="day-island-sub">${isDay1Completed ? '학습 완료' : '기초 훈련'}</div>
                        </div>
                        <div class="day-island-status">${isDay1Completed ? '✓' : '➔'}</div>
                    `;
                    island.onclick = () => { playButtonSound(); showRuleScreen(); };
                } else {
                    island.className = 'day-island locked';
                    island.innerHTML = `
                        <div>
                            <div class="day-island-title">DAY ${i < 10 ? '0' + i : i}</div>
                            <div class="day-island-sub">잠김</div>
                        </div>
                        <div class="day-island-status">🔒</div>
                    `;
                    island.onclick = () => { playButtonSound(); alert('이전 과제를 먼저 완료해라!'); };
                }
                container.appendChild(island);
            }
        }

        function showRuleScreen() {
            document.getElementById('day-screen').classList.add('hidden');
            document.getElementById('rule-screen').classList.remove('hidden');
        }

        function startQuiz() {
            currentQuizIndex = 0;
            document.getElementById('rule-screen').classList.add('hidden');
            loadQuestion(currentQuizIndex);
        }

        function loadQuestion(index) {
            clearInterval(quizTimerInterval);
            quizTimeLeft = 20;
            document.getElementById('quiz-timer').innerText = quizTimeLeft;

            const q = questions[index];
            document.getElementById('q-title').innerText = q.title;
            document.getElementById('q-text').innerHTML = q.text;

            const optionsContainer = document.getElementById('q-options');
            optionsContainer.innerHTML = ''; 

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.label;
                btn.onclick = () => { 
                    clearInterval(quizTimerInterval);
                    playButtonSound(); 
                    checkAnswer(opt.val); 
                };
                optionsContainer.appendChild(btn);
            });

            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            quizTimerInterval = setInterval(() => {
                quizTimeLeft--;
                document.getElementById('quiz-timer').innerText = quizTimeLeft;
                if (quizTimeLeft <= 0) {
                    clearInterval(quizTimerInterval);
                    handleQuizTimeout();
                }
            }, 1000);
        }

        function handleQuizTimeout() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const resultImg = document.getElementById('result-img');
            resultImg.style.display = 'block';
            isCorrectAnswer = false;
            resultImg.src = "wrong.png"; 
            document.getElementById('result-msg').style.color = "#dc2626";
            document.getElementById('result-msg').innerText = "시간 초과!";
            document.getElementById('result-exp').classList.add('hidden');
            document.getElementById('action-btn').innerText = "다시 풀기";

            playSoundFile('wrong.mp3');
        }

        function checkAnswer(selectedOption) {
            const q = questions[currentQuizIndex];
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            const resultImg = document.getElementById('result-img');
            resultImg.style.display = 'block';

            if (selectedOption === q.correct) {
                isCorrectAnswer = true;
                resultImg.src = "correct.gif"; 
                document.getElementById('result-msg').style.color = "var(--primary-pink)";
                document.getElementById('result-msg').innerText = "정답입니다!";
                
                document.getElementById('result-exp').innerText = q.explanation;
                document.getElementById('result-exp').classList.remove('hidden');

                document.getElementById('action-btn').innerText = (currentQuizIndex + 1 < questions.length) ? "다음 문제" : "복습하기";
                playSoundFile('correct.mp3');
            } else {
                isCorrectAnswer = false;
                resultImg.src = "wrong.png"; 
                document.getElementById('result-msg').style.color = "#dc2626";
                document.getElementById('result-msg').innerText = "오답입니다!";
                document.getElementById('result-exp').classList.add('hidden');
                document.getElementById('action-btn').innerText = "다시 풀기";

                playSoundFile('wrong.mp3');
            }
        }

        function handleNextAction() {
            if (isCorrectAnswer) {
                currentQuizIndex++;
                if (currentQuizIndex < questions.length) {
                    loadQuestion(currentQuizIndex);
                } else {
                    document.getElementById('result-screen').classList.add('hidden');
                    startVocabularyDeck();
                }
            } else {
                loadQuestion(currentQuizIndex);
            }
        }

        function startReview() {
            currentReviewIndex = 0;
            isShowingMeaning = false;
            updateFlashcardContent();
            document.getElementById('review-screen').classList.remove('hidden');
        }

        function updateFlashcardContent() {
            clearInterval(reviewTimerInterval);
            reviewTimeLeft = 5;
            document.getElementById('review-timer').innerText = reviewTimeLeft;

            const card = activeFlashcards[currentReviewIndex];
            const cardLabel = document.getElementById('card-label');
            const cardText = document.getElementById('card-text');
            const reviewBtn = document.getElementById('review-btn');

            if (!isShowingMeaning) {
                cardLabel.innerText = "WORD";
                cardText.innerText = card.word;
                cardText.style.color = "var(--text-dark)";
                reviewBtn.innerText = "정답 확인";
            } else {
                cardLabel.innerText = "MEANING";
                cardText.innerText = card.meaning;
                cardText.style.color = "var(--primary-pink)";
                reviewBtn.innerText = (currentReviewIndex === activeFlashcards.length - 1) ? "학습 완료" : "다음 단어";
            }

            reviewTimerInterval = setInterval(() => {
                reviewTimeLeft--;
                document.getElementById('review-timer').innerText = reviewTimeLeft;
                if (reviewTimeLeft <= 0) {
                    clearInterval(reviewTimerInterval);
                    handleReviewAction();
                }
            }, 1000);
        }

        function handleReviewAction() {
            clearInterval(reviewTimerInterval);
            if (!isShowingMeaning) {
                isShowingMeaning = true;
                updateFlashcardContent();
            } else {
                currentReviewIndex++;
                if (currentReviewIndex < activeFlashcards.length) {
                    isShowingMeaning = false;
                    updateFlashcardContent();
                } else {
                    localStorage.setItem('dofla_day1_completed', 'true');
                    triggerCompletionEffects();
                }
            }
        }

        function triggerCompletionEffects() {
            playSoundFile('end.mp3');
            try {
                confetti({ particleCount: 100, spread: 60, origin: { y: 0.6 } });
            } catch(e) {}

            document.getElementById('review-screen').classList.add('hidden');
            document.getElementById('complete-screen').classList.remove('hidden');
        }

        function returnToMainFromComplete() {
            document.getElementById('complete-screen').classList.add('hidden');
            document.getElementById('title-screen').classList.remove('hidden');
        }

        const bottomSheet = document.getElementById('bottom-sheet');
        const sheetBackdrop = document.getElementById('sheet-backdrop');

        function openBottomSheet() {
            sheetBackdrop.classList.add('active');
            bottomSheet.classList.add('active');
        }

        function closeBottomSheet() {
            bottomSheet.classList.remove('active');
            sheetBackdrop.classList.remove('active');
        }

        function openQuickWordSheet() {
            document.getElementById('sheet-content').innerHTML = `
                <div class="quick-word-list">
                    <div class="quick-word-item"><span class="word">Formerly</span><span class="meaning">이전에</span></div>
                    <div class="quick-word-item"><span class="word">withdraw</span><span class="meaning">철회하다</span></div>
                    <div class="quick-word-item"><span class="word">aside</span><span class="meaning">따로</span></div>
                    <div class="quick-word-item"><span class="word">representation</span><span class="meaning">대표단</span></div>
                    <div class="quick-word-item"><span class="word">recession</span><span class="meaning">불경기</span></div>
                </div>
            `;
            openBottomSheet();
        }

        function initBottomSheetEvents() {
            let startY = 0;
            const header = document.getElementById('sheet-header');
            header.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
            header.addEventListener('touchend', (e) => {
                if (e.changedTouches[0].clientY - startY > 50) closeBottomSheet();
            });
        }
    </script>
</body>
</html>
